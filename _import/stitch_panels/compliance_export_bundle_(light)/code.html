<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Compliance Export Bundle</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
              "surface-light": "#ffffff",
              "surface-dark": "#1a2430",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-xl">
<!-- Header -->
<div class="sticky top-0 z-20 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md px-4 py-3 justify-between border-b border-slate-200 dark:border-slate-800">
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em]">Configure Export</h2>
<div class="flex w-12 items-center justify-end">
<button class="text-primary hover:text-blue-600 text-base font-semibold leading-normal tracking-[0.015em] shrink-0 transition-colors">
                    Cancel
                </button>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto pb-32">
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal leading-normal py-4 px-4">
                Select the evidence categories to include in this compliance bundle.
            </p>
<!-- Hero Summary Card -->
<div class="px-4 mb-6">
<div class="relative overflow-hidden flex flex-col items-stretch justify-end rounded-xl pt-32 shadow-lg group">
<!-- Background Image with Overlay -->
<div class="absolute inset-0 bg-cover bg-center z-0 transition-transform duration-500 group-hover:scale-105" data-alt="Abstract business documents and charts on a desk" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAtJcoJwZ7zb53VhAYqjfJH_u4f1X5JZtXXVMiSqg6xPNhlgGxmRiIKmoYbGH_qryvqkug9FUlxjYLfdfqf8y-Vvv7G2jFjNj-TXFnuNY60suHo8yO8L8wIvrRjvGdA9Z6vnMorcoCRWc5-TZCXa_n1IMOcl_jk7mT98eYQA8CZyAB_gz5HaANTIeNlMIfVNKZvWZa2bwmnryt5ae5gz09FtKGhrEFOOC4YL4K_MjWw8d4x4QGzu13fp48fT_6ePFK-Y1kJHvcIMQHj");'>
</div>
<div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent z-10"></div>
<div class="relative z-20 flex w-full items-end justify-between gap-4 p-5">
<div class="flex flex-1 flex-col gap-1">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-white text-[20px]">folder_zip</span>
<p class="text-white/80 text-xs font-medium uppercase tracking-wider">Ready to Package</p>
</div>
<p class="text-white tracking-tight text-2xl font-bold leading-tight">Bundle Summary</p>
<p class="text-slate-200 text-sm font-medium leading-normal mt-1">174 files selected • Est. size 45MB</p>
</div>
</div>
</div>
</div>
<!-- Configuration Options -->
<div class="px-4 space-y-6">
<!-- Format & Date -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 space-y-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[18px]">calendar_month</span>
</div>
<span class="text-slate-900 dark:text-slate-100 font-medium text-sm">Date Range</span>
</div>
<button class="text-primary text-sm font-semibold flex items-center gap-1 hover:text-blue-600 transition-colors">
                            Last Quarter
                            <span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
</div>
<div class="h-px bg-slate-100 dark:bg-slate-700 w-full"></div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[18px]">output</span>
</div>
<span class="text-slate-900 dark:text-slate-100 font-medium text-sm">Export Format</span>
</div>
<div class="flex bg-slate-100 dark:bg-slate-800 rounded-lg p-1">
<button class="px-3 py-1 bg-white dark:bg-slate-700 shadow-sm rounded-md text-xs font-semibold text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-600">ZIP</button>
<button class="px-3 py-1 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">PDF</button>
</div>
</div>
</div>
<!-- Evidence Categories List -->
<div>
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-bold uppercase tracking-wider mb-3 px-1">Evidence Categories</h3>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm border border-slate-100 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
<!-- Item 1 -->
<label class="flex items-center gap-4 p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
<div class="relative flex items-center">
<input checked="" class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 checked:border-primary checked:bg-primary transition-all focus:ring-0 focus:ring-offset-0" type="checkbox"/>
<span class="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100">
<svg class="h-3.5 w-3.5" fill="currentColor" stroke="currentColor" stroke-width="1" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</span>
</div>
<div class="flex-1">
<p class="text-slate-900 dark:text-slate-100 text-base font-medium leading-tight group-hover:text-primary transition-colors">Corporate Governance</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-1">4 files • Articles, Board Minutes</p>
</div>
<div class="bg-primary/10 text-primary p-1.5 rounded-lg">
<span class="material-symbols-outlined text-[20px]">gavel</span>
</div>
</label>
<!-- Item 2 -->
<label class="flex items-center gap-4 p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
<div class="relative flex items-center">
<input checked="" class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 checked:border-primary checked:bg-primary transition-all focus:ring-0 focus:ring-offset-0" type="checkbox"/>
<span class="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100">
<svg class="h-3.5 w-3.5" fill="currentColor" stroke="currentColor" stroke-width="1" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</span>
</div>
<div class="flex-1">
<p class="text-slate-900 dark:text-slate-100 text-base font-medium leading-tight group-hover:text-primary transition-colors">Security &amp; Access Logs</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-1">128 files • Raw Logs, Incidents</p>
</div>
<div class="bg-slate-100 dark:bg-slate-800 text-slate-500 p-1.5 rounded-lg">
<span class="material-symbols-outlined text-[20px]">shield</span>
</div>
</label>
<!-- Item 3 (Empty/Disabled) -->
<label class="flex items-center gap-4 p-4 cursor-not-allowed opacity-60">
<div class="relative flex items-center">
<input class="peer h-5 w-5 appearance-none rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50" disabled="" type="checkbox"/>
</div>
<div class="flex-1">
<p class="text-slate-900 dark:text-slate-100 text-base font-medium leading-tight">Financial Statements</p>
<p class="text-slate-400 dark:text-slate-500 text-xs mt-1">0 files selected</p>
</div>
<div class="bg-slate-100 dark:bg-slate-800 text-slate-400 p-1.5 rounded-lg">
<span class="material-symbols-outlined text-[20px]">attach_money</span>
</div>
</label>
<!-- Item 4 -->
<label class="flex items-center gap-4 p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
<div class="relative flex items-center">
<input checked="" class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 checked:border-primary checked:bg-primary transition-all focus:ring-0 focus:ring-offset-0" type="checkbox"/>
<span class="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100">
<svg class="h-3.5 w-3.5" fill="currentColor" stroke="currentColor" stroke-width="1" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</span>
</div>
<div class="flex-1">
<p class="text-slate-900 dark:text-slate-100 text-base font-medium leading-tight group-hover:text-primary transition-colors">Policy Acknowledgments</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-1">42 files • Signed PDFs</p>
</div>
<div class="bg-slate-100 dark:bg-slate-800 text-slate-500 p-1.5 rounded-lg">
<span class="material-symbols-outlined text-[20px]">assignment_turned_in</span>
</div>
</label>
</div>
</div>
</div>
</div>
<!-- Sticky Bottom Action Area -->
<div class="fixed bottom-0 w-full max-w-md bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 p-4 pb-8 z-30">
<div class="flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">file_download</span>
                    Generate Export Bundle
                </button>
<button class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold py-3.5 px-4 rounded-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">visibility</span>
                    Preview Manifest
                </button>
<div class="flex items-center justify-center gap-1.5 mt-1">
<span class="material-symbols-outlined text-slate-400 text-[14px]">lock</span>
<span class="text-xs text-slate-400 font-medium">End-to-end encrypted generation</span>
</div>
</div>
</div>
</div>
</body></html>
