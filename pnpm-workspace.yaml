packages:
  - "packages/*"
  - "!packages/sdk-go"
  - "!packages/sdk-python"
  - "!packages/sdk-ruby"
  - "!packages/workhorse"

# Install against the lockfile when possible and keep native optional binaries
# available for local WSL verification, Linux Vercel builds, and Windows/macOS
# contributor installs. Keeping this in pnpm-workspace.yaml avoids npm/npx
# warning on pnpm-only project settings while preserving pnpm behavior.
preferFrozenLockfile: true
supportedArchitectures:
  os:
    - current
    - linux
    - win32
    - darwin
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
    - musl

overrides:
  prisma: 7.8.0
  "@prisma/client": 7.8.0
  "@types/react": 18.3.28
  "@types/react-dom": 18.3.7
  rimraf: ^5.0.0
  raw-body: ^2.5.2
  hono: ^4.12.18
  qs: ^6.14.1
  body-parser: ^1.20.4
  tar: ^7.5.3
  lodash: ^4.18.1
  seroval: ^1.4.1
  undici: ^7.0.0
  cookie: ^0.7.1
  follow-redirects: ^1.16.0
  word-wrap: ^1.2.5
  fast-xml-parser: ^5.5.7
  fast-xml-builder: ^1.2.0
  esbuild: ^0.25.0
  glob: ^13.0.6
  minimatch: ">=10.2.1"
  eslint: ^9.39.4
  "@types/pg": 8.20.0
  handlebars: ^4.7.9
  picomatch: ^4.0.4
  yaml: ^2.8.3
  brace-expansion: ^5.0.6
  path-to-regexp: ^8.4.2
  "@hono/node-server": ^1.19.10
  effect: ^3.20.0
  defu: ^6.1.5
  rollup: ^4.59.0
  "@tootallnate/once": ^3.0.1
  dompurify: 3.4.9
  protobufjs: 7.6.3
  axios: ^1.15.2
  next: ^16.2.6
  fast-uri: ^3.1.2
  "@opentelemetry/auto-instrumentations-node": ^0.76.0
  "@opentelemetry/sdk-node": ^0.218.0
  "@opentelemetry/exporter-prometheus": ^0.218.0
  ws: ^8.20.1
  postcss: ^8.5.10
  uuid: ^13.0.1
  ajv: 6.14.0
  "ip-address": 10.2.0
  "@opentelemetry/core": 2.8.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - bcrypt
  - better-sqlite3
  - prisma
  - "@prisma/engines"
  - "@prisma/client"
  - "@playwright/browser-chromium"
  - "@sentry-internal/node-cpu-profiler"
  - "@sentry/cli"
  - protobufjs
  - isolated-vm
  - msgpackr-extract
  - unrs-resolver

patchedDependencies:
  proper-lockfile@4.1.2: patches/proper-lockfile@4.1.2.patch

# These are deprecated transitive packages retained by current maintained
# toolchains: Jest 30, jsdom/Cheerio, OpenTelemetry's GCP resource detector,
# and better-sqlite3's native prebuild path. They are not direct runtime API
# dependencies and have no high/critical advisory in the current audit.
allowedDeprecatedVersions:
  "@ungap/structured-clone": 1.3.0
  node-domexception: 1.0.0
  prebuild-install: 7.1.3
  whatwg-encoding: 3.1.1
