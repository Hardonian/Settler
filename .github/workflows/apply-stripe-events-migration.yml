name: Apply Stripe Events Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20250121000000_add_stripe_events_table.sql"
      - "prisma/migrations/20250121000000_add_stripe_events_table/**"

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}

jobs:
  apply-migration:
    name: Apply Stripe Events Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: |
          supabase link --project-ref ${{ env.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Supabase migration
        run: |
          echo "Applying migration: 20250121000000_add_stripe_events_table.sql"
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration applied
        run: |
          echo "Verifying stripe_events table exists..."
          npx tsx -e "
            import { Pool } from 'pg';
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            const result = await pool.query(\`
              SELECT EXISTS (
                SELECT FROM information_schema.tables 
                WHERE table_schema = 'public' 
                AND table_name = 'stripe_events'
              );
            \`);
            if (result.rows[0].exists) {
              console.log('✅ stripe_events table exists');
              process.exit(0);
            } else {
              console.error('❌ stripe_events table not found');
              process.exit(1);
            }
            await pool.end();
          "
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Generate Prisma client
        run: |
          PRISMA_CLIENT_ENGINE_TYPE=binary npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify Prisma types
        run: |
          echo "Verifying StripeEvent model in Prisma client..."
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            // Check if StripeEvent model exists by trying to access it
            if (prisma.stripeEvent) {
              console.log('✅ StripeEvent model available in Prisma client');
              process.exit(0);
            } else {
              console.error('❌ StripeEvent model not found');
              process.exit(1);
            }
          "

      - name: Migration summary
        run: |
          echo "## Migration Applied Successfully ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Migration:** 20250121000000_add_stripe_events_table" >> $GITHUB_STEP_SUMMARY
          echo "**Table Created:** stripe_events" >> $GITHUB_STEP_SUMMARY
          echo "**Prisma Client:** Regenerated with StripeEvent model" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure Stripe webhook endpoint" >> $GITHUB_STEP_SUMMARY
          echo "2. Set STRIPE_WEBHOOK_SECRET environment variable" >> $GITHUB_STEP_SUMMARY
          echo "3. Test webhook with Stripe test events" >> $GITHUB_STEP_SUMMARY
