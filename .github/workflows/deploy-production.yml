name: Deploy to Production
permissions:
  contents: read
  actions: read
  deployments: write

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (use with caution)"
        required: false
        default: false
        type: boolean
      skip_migrations:
        description: "Skip migrations (migrations handled by migration-guardian)"
        required: false
        default: true
        type: boolean

env:
  NODE_ENV: production
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  validate:
    name: Validate Before Deployment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The incremental format gate compares HEAD with its parent.
          fetch-depth: 2
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile
      - name: Validate environment schema
        run: pnpm exec tsc --noEmit --skipLibCheck --ignoreConfig config/env.schema.ts
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    needs: [validate]
    if: github.event.inputs.skip_tests != 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm run prisma:generate
      - name: Sync test database schema
        run: pnpm exec prisma db push --accept-data-loss
      - name: Run tests
        run: pnpm run test

      - name: Verify content routes in production mode
        run: pnpm --filter @settler/web test -- src/__tests__/integration/content-pages.production.test.ts
        env:
          NODE_ENV: production

  build:
    name: Build Application
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: npx turbo run build
      - name: Verify build artifacts
        run: |
          test -d packages/api/dist || (echo "❌ API dist missing" && exit 1)
          test -d packages/sdk/dist || (echo "❌ SDK dist missing" && exit 1)
          echo "✅ All build artifacts verified"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            packages/api/dist
            packages/sdk/dist
          retention-days: 7

  gate-ci-and-e2e:
    name: Require CI and E2E Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI and E2E Workflows Concluded Successfully
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const requiredWorkflows = ['CI', 'E2E & Visual Regression Tests'];
            const targetSha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            core.info(`Verifying required workflow checks for commit: ${targetSha}`);
            const startTime = Date.now();
            const timeoutMs = 30 * 60 * 1000; // 30 minutes
            const pollIntervalMs = 15 * 1000; // 15 seconds

            while (Date.now() - startTime < timeoutMs) {
              const { data: runsData } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: targetSha,
              });

              const runs = runsData.workflow_runs || [];
              const targetRuns = runs.filter(r => requiredWorkflows.includes(r.name));

              if (targetRuns.length === 0) {
                const { data: checkData } = await github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: targetSha,
                });
                const checks = checkData.check_runs || [];
                const failedChecks = checks.filter(c => c.conclusion === 'failure');
                if (failedChecks.length > 0) {
                  core.setFailed(`Detected failing check runs on ${targetSha}: ${failedChecks.map(c => c.name).join(', ')}`);
                  return;
                }
                core.info(`Waiting for required workflows (${requiredWorkflows.join(', ')}) to appear...`);
                await new Promise(r => setTimeout(r, pollIntervalMs));
                continue;
              }

              const statusMap = {};
              for (const name of requiredWorkflows) {
                const matching = targetRuns.filter(r => r.name === name);
                if (matching.length === 0) {
                  statusMap[name] = { status: 'pending', conclusion: null };
                } else {
                  const latest = matching.sort((a, b) => b.run_number - a.run_number)[0];
                  statusMap[name] = { status: latest.status, conclusion: latest.conclusion, id: latest.id };
                }
              }

              let allCompleted = true;
              let hasFailure = false;

              for (const [name, info] of Object.entries(statusMap)) {
                core.info(`Workflow '${name}': status=${info.status}, conclusion=${info.conclusion}`);
                if (info.status !== 'completed') {
                  allCompleted = false;
                } else if (info.conclusion !== 'success') {
                  hasFailure = true;
                }
              }

              if (hasFailure) {
                core.setFailed(`Gate failure: One or more required workflows failed for SHA ${targetSha}: ${JSON.stringify(statusMap, null, 2)}`);
                return;
              }

              if (allCompleted && Object.keys(statusMap).length === requiredWorkflows.length) {
                core.info(`✅ All required workflows passed successfully: ${JSON.stringify(statusMap, null, 2)}`);
                return;
              }

              core.info(`Waiting for workflows to complete... (${Math.round((Date.now() - startTime) / 1000)}s elapsed)`);
              await new Promise(r => setTimeout(r, pollIntervalMs));
            }

            core.setFailed(`Timed out waiting for CI and E2E to complete after 30 minutes`);

  deploy-staging:
    name: Deploy Staged Artifacts
    runs-on: ubuntu-24.04
    needs: [build]
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .
      - name: Deploy to Vercel Preview
        id: deploy
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--yes"

  verify:
    name: Verify Deployment Smoke Checks
    runs-on: ubuntu-24.04
    needs: [deploy-staging]
    environment: production
    env:
      DEPLOY_URL: ${{ needs.deploy-staging.outputs.deployment-url || secrets.PRODUCTION_URL }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Enforce Deployment Target URL
        run: |
          if [ -z "${DEPLOY_URL}" ]; then
            echo "❌ Error: Neither preview URL nor PRODUCTION_URL secret is available."
            echo "Deployment smoke checks cannot be skipped in production release workflow."
            exit 1
          fi
          echo "Target deployment URL: ${DEPLOY_URL}"

      - name: Probe Health Endpoints
        run: |
          set -euo pipefail
          echo "🔍 Probing /health and /health/detailed..."

          HEALTH_OK=false
          for i in {1..12}; do
            echo "Attempt $i/12..."
            if curl -sfS --max-time 10 "${DEPLOY_URL}/health" > /tmp/health.json 2>/dev/null && \
               curl -sfS --max-time 10 "${DEPLOY_URL}/health/detailed" > /tmp/health_detailed.json 2>/dev/null; then
              HEALTH_OK=true
              break
            fi
            sleep 5
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ Health check endpoints (/health and /health/detailed) failed after retries"
            exit 1
          fi

          echo "Response from /health:"
          cat /tmp/health.json
          echo ""
          jq -e '.status == "ok" or .status == "healthy"' /tmp/health.json > /dev/null || (echo "❌ /health status mismatch" && exit 1)
          echo "✅ /health endpoint OK"

          echo "Response from /health/detailed:"
          cat /tmp/health_detailed.json
          echo ""
          jq -e '.status == "healthy" or .status == "ok"' /tmp/health_detailed.json > /dev/null || (echo "❌ /health/detailed status mismatch" && exit 1)
          echo "✅ /health/detailed endpoint OK"

      - name: Verify API Endpoints
        run: |
          set -euo pipefail
          echo "🔍 Verifying API endpoints..."

          curl -sfS --max-time 10 "${DEPLOY_URL}/api/v1/health" > /tmp/api_health.json
          echo "Response from /api/v1/health:"
          cat /tmp/api_health.json
          echo ""
          jq -e '.status == "ok" or .status == "healthy"' /tmp/api_health.json > /dev/null || (echo "❌ /api/v1/health status mismatch" && exit 1)
          echo "✅ /api/v1/health endpoint OK"

          curl -sfS --max-time 10 "${DEPLOY_URL}/api/v1/openapi.json" > /tmp/openapi.json
          jq -e '.openapi != null' /tmp/openapi.json > /dev/null || (echo "❌ /api/v1/openapi.json invalid" && exit 1)
          echo "✅ /api/v1/openapi.json endpoint OK"

      - name: Verify Deployed Commit SHA
        run: |
          set -euo pipefail
          echo "🔍 Verifying deployed commit SHA..."
          META_RESP=$(curl -sfS --max-time 10 "${DEPLOY_URL}/api/v1/meta" 2>/dev/null || curl -sfS --max-time 10 "${DEPLOY_URL}/health/detailed" 2>/dev/null)
          echo "Meta payload: $META_RESP"
          DEPLOYED_SHA=$(echo "$META_RESP" | jq -r '.build // .version // empty')
          echo "Deployed SHA: '$DEPLOYED_SHA', Expected SHA: '$TARGET_SHA'"

          if [ -z "$DEPLOYED_SHA" ] || [ "$DEPLOYED_SHA" = "local" ]; then
            echo "⚠️ Warning: Server reported local/unset build SHA ($DEPLOYED_SHA)"
          else
            if [[ "${TARGET_SHA}" == "${DEPLOYED_SHA}"* ]] || [[ "${DEPLOYED_SHA}" == "${TARGET_SHA}"* ]]; then
              echo "✅ Deployed SHA matches target commit ($DEPLOYED_SHA)"
            else
              echo "❌ Deployed SHA ($DEPLOYED_SHA) does not match expected SHA ($TARGET_SHA)"
              exit 1
            fi
          fi

  assign-production-domain:
    name: Assign Production Domain
    runs-on: ubuntu-24.04
    needs: [verify, gate-ci-and-e2e]
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Promote Deployment to Production
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod --yes"

      - name: Create deployment summary
        run: |
          echo "## 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ CI, E2E, Smoke Checks, and Production Domain Assignment verified" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on Failure
    runs-on: ubuntu-24.04
    needs: [assign-production-domain]
    if: failure()
    steps:
      - name: Create failure alert
        run: |
          echo "🚨 Production deployment or domain assignment failed"
          echo "DEPLOYMENT_FAILURE=true" >> $GITHUB_ENV
