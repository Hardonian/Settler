name: Founder Daily Report

on:
  schedule:
    # Run daily at 07:40 America/Toronto (11:40 UTC)
    - cron: '40 11 * * *'
    # Optional: Also run at 16:40 Toronto (21:40 UTC)
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run report in'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  generate-daily-report:
    name: Generate Founder Daily Report
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Daily Report
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo "📊 Generating Founder Daily Report..."
          npm run ops:daily || {
            echo "⚠️ Report generation failed, but continuing..."
            exit 0  # Don't fail the workflow, just log
          }

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founders-daily-report-${{ github.run_number }}
          path: |
            ops/reports/FOUNDERS_DAILY_REPORT.md
            ops/reports/FOUNDERS_DAILY_REPORT.json
          retention-days: 30

      - name: Report Summary
        if: success()
        run: |
          echo "## ✅ Founder Daily Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Report artifacts uploaded. Check the workflow artifacts to download." >> $GITHUB_STEP_SUMMARY

      - name: Report Failed
        if: failure()
        run: |
          echo "## ❌ Founder Daily Report Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ Daily report generation failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
