name: Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  security-invariants:
    name: Security Invariant Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app for runtime header probing
        run: pnpm --filter @settler/web build

      - name: Generate route registry
        run: pnpm run security:routes

      - name: Verify tenant coverage (must be 100%)
        run: pnpm run verify:tenant

      - name: Run cross-tenant runtime tests
        run: pnpm run test:cross-tenant

      - name: Verify security controls
        run: node scripts/verify-security.mjs

      - name: CSP + headers smoke verification
        run: pnpm exec tsx scripts/security-smoke.ts

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app for runtime header probing
        run: pnpm --filter @settler/web build

      - name: Run dependency audit gate (strict mode)
        env:
          SECURITY_AUDIT_MODE: strict
        run: pnpm run audit:deps

      - name: Assert CI audit policy is not off
        run: |
          test "${SECURITY_AUDIT_MODE:-strict}" != "off"

      - name: Materialize authenticated Dependabot export (optional)
        if: ${{ secrets.DEPENDABOT_ALERTS_EXPORT_B64 != '' }}
        run: |
          echo "${{ secrets.DEPENDABOT_ALERTS_EXPORT_B64 }}" | base64 -d > security/dependabot-alerts.json

      - name: Generate layered security evidence (full mode)
        env:
          SECURITY_AUDIT_MODE: strict
          SECURITY_HEADER_PROBE_STRICT: "1"
          SECURITY_DEPENDENCY_EVIDENCE_MODE: standard
          SECURITY_RLS_EVIDENCE_MODE: static-only
          DEPENDABOT_ALERTS_EXPORT_PATH: security/dependabot-alerts.json
        run: pnpm run verify:security:full

      - name: Enterprise gate (strict evidence when secrets exist)
        if: ${{ secrets.DEPENDABOT_ALERTS_EXPORT_B64 != '' && (secrets.DATABASE_URL != '' || secrets.DIRECT_URL != '' || secrets.SUPABASE_DB_URL != '') }}
        env:
          SECURITY_AUDIT_MODE: strict
          SECURITY_HEADER_PROBE_STRICT: "1"
          SECURITY_DEPENDENCY_EVIDENCE_MODE: strict
          SECURITY_RLS_EVIDENCE_MODE: runtime-rls-required
          DEPENDABOT_ALERTS_EXPORT_PATH: security/dependabot-alerts.json
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm run verify:security:enterprise

      - name: Upload security evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.run_id }}
          path: |
            artifacts/security
            security/*.json
            security/*.md

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          no-git: false
          verbose: true
          redact: true

  codeql:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
