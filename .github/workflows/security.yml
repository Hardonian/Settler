name: Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  security-invariants:
    name: Security Invariant Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app for runtime header probing
        run: pnpm --filter @settler/web build

      - name: Generate route registry
        run: pnpm run security:routes

      - name: Verify tenant coverage (must be 100%)
        run: pnpm run verify:tenant

      - name: Run cross-tenant runtime tests
        run: pnpm run test:cross-tenant

      - name: Verify security controls
        run: node scripts/verify-security.mjs

      - name: CSP + headers smoke verification
        run: pnpm exec tsx scripts/security-smoke.ts

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app for runtime header probing
        run: pnpm --filter @settler/web build

      - name: Run dependency audit gate (strict mode)
        env:
          SECURITY_AUDIT_MODE: strict
        run: pnpm run audit:deps

      - name: Assert CI audit policy is not off
        run: |
          test "${SECURITY_AUDIT_MODE:-strict}" != "off"

      - name: Materialize authenticated Dependabot export (optional)
        if: ${{ secrets.DEPENDABOT_ALERTS_EXPORT_B64 != '' }}
        run: |
          echo "${{ secrets.DEPENDABOT_ALERTS_EXPORT_B64 }}" | base64 -d > security/dependabot-alerts.json

      - name: Enforce dependency triage completeness policy
        env:
          DEPENDENCY_TRIAGE_REQUIRE_AUTHENTICATED_EXPORT: "1"
          DEPENDABOT_ALERTS_EXPORT_PATH: security/dependabot-alerts.json
        run: node scripts/security/dependency-triage.mjs

      - name: Generate security evidence + drift detection
        env:
          SECURITY_AUDIT_MODE: strict
          SECURITY_HEADER_PROBE_STRICT: "1"
          DEPENDENCY_TRIAGE_REQUIRE_AUTHENTICATED_EXPORT: "1"
          DEPENDABOT_ALERTS_EXPORT_PATH: security/dependabot-alerts.json
        run: pnpm run security:evidence

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          no-git: false
          verbose: true
          redact: true

  codeql:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
