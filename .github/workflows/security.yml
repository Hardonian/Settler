name: Security Invariants & Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # Weekly audit on Monday at 06:00 UTC

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  security-invariants:
    name: Layered Security Invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tenant isolation invariants
        run: pnpm run verify:tenant

      - name: Verify tenant isolation runtime tests
        run: pnpm --filter @settler/api exec jest --testPathPattern=tenant-isolation-enforced --runInBand

      - name: Fast security posture verification
        run: pnpm run verify:security:fast

      - name: Verify security classification
        run: pnpm run check:classification

      - name: Run cross-tenant runtime tests
        run: pnpm run test:cross-tenant

      - name: Verify security controls
        run: node scripts/verify-security.mjs

      - name: CSP + headers smoke verification
        run: pnpm exec tsx scripts/security-smoke.ts

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages (web build consumes dist)
        run: pnpm run build

      - name: Build web app for runtime header probing
        run: pnpm --filter @settler/web build

      - name: Run dependency audit gate (strict mode)
        env:
          SECURITY_AUDIT_MODE: strict
        run: pnpm run audit:deps

      - name: Assert CI audit policy is not off
        run: |
          test "${SECURITY_AUDIT_MODE:-strict}" != "off"

      - name: Materialize authenticated Dependabot export (optional)
        env:
          DEPENDABOT_ALERTS_EXPORT_B64: ${{ fromJSON(toJSON(secrets))['DEPENDABOT_ALERTS_EXPORT_B64'] }}
        run: |
          if [ -n "$DEPENDABOT_ALERTS_EXPORT_B64" ]; then
            echo "$DEPENDABOT_ALERTS_EXPORT_B64" | base64 -d > security/dependabot-alerts.json
          else
            echo "No authenticated Dependabot export secret provided, skipping."
          fi

      - name: Generate layered security evidence (full mode)
        env:
          SECURITY_AUDIT_MODE: strict
          SECURITY_HEADER_PROBE_STRICT: "1"
          SECURITY_DEPENDENCY_EVIDENCE_MODE: standard
          SECURITY_RLS_EVIDENCE_MODE: static-only
          DEPENDABOT_ALERTS_EXPORT_PATH: security/dependabot-alerts.json
        run: pnpm run verify:security:full

      - name: Enterprise gate (strict evidence when secrets exist)
        env:
          SECURITY_AUDIT_MODE: strict
          SECURITY_HEADER_PROBE_STRICT: "1"
          SECURITY_DEPENDENCY_EVIDENCE_MODE: strict
          SECURITY_RLS_EVIDENCE_MODE: runtime-rls-required
          DEPENDABOT_ALERTS_EXPORT_PATH: security/dependabot-alerts.json
          DEPENDABOT_ALERTS_EXPORT_B64: ${{ fromJSON(toJSON(secrets))['DEPENDABOT_ALERTS_EXPORT_B64'] }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ fromJSON(toJSON(secrets))['DIRECT_URL'] }}
          SUPABASE_DB_URL: ${{ fromJSON(toJSON(secrets))['SUPABASE_DB_URL'] }}
        run: |
          if [ -n "$DEPENDABOT_ALERTS_EXPORT_B64" ] && { [ -n "$DATABASE_URL" ] || [ -n "$DIRECT_URL" ] || [ -n "$SUPABASE_DB_URL" ]; }; then
            pnpm run verify:security:enterprise
          else
            echo "Skipping enterprise gate (live database credentials or Dependabot export not configured)"
          fi

      - name: Upload security evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: security-evidence-${{ github.run_id }}
          path: |
            artifacts/security
            security/*.json
            security/*.md

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
