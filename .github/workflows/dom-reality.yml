name: DOM Reality Enforcement

on:
  pull_request:
    paths:
      - 'packages/web/**'
      - 'tests/e2e/dom-reality-enforcement.spec.ts'
      - 'tests/utils/dom-reality-utils.ts'
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/web/**'
      - 'tests/e2e/dom-reality-enforcement.spec.ts'
  workflow_dispatch:

jobs:
  dom-reality:
    name: DOM Reality Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Environment variables from GitHub secrets (same as preview/production)
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start development server
        run: |
          npm run dev --workspace=packages/web &
          echo $! > server.pid
        env:
          # Pass through all environment variables to dev server
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          NODE_ENV: test

      - name: Wait for server
        run: |
          timeout=120
          elapsed=0
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "Server failed to start within $timeout seconds"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Server is ready"

      - name: Run DOM reality tests
        run: npm run qa:dom-reality
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: true
          # Pass through environment variables to test process
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        continue-on-error: true

      - name: Generate report
        if: always()
        run: npm run qa:dom-reality:report
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-reality-results
          path: |
            test-results/
          retention-days: 30

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-reality-report
          path: |
            test-results/dom-reality-report.md
            test-results/dom-reality-report.json
          retention-days: 30

      - name: Generate CI output
        if: always()
        run: |
          npx tsx scripts/dom-reality-ci-integration.ts test-results/dom-reality-reports output > ci-output.md
        continue-on-error: true

      - name: Comment PR with report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            try {
              // Try to use CI integration output first
              const ciOutputPath = path.join(process.cwd(), 'ci-output.md');
              let body;
              
              if (fs.existsSync(ciOutputPath)) {
                body = fs.readFileSync(ciOutputPath, 'utf-8');
              } else {
                // Fallback to report generation
                const reportPath = path.join(process.cwd(), 'test-results', 'dom-reality-reports', 'DOM_REALITY_REPORT.md');
                if (fs.existsSync(reportPath)) {
                  const report = fs.readFileSync(reportPath, 'utf-8');
                  body = `## 🔍 DOM Reality Report\n\n\`\`\`\n${report.substring(0, 2000)}\n\`\`\`\n\n[View full report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
                } else {
                  body = '## 🔍 DOM Reality Report\n\n⚠️ Report not available. Check workflow logs for details.';
                }
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      - name: Check critical issues
        if: always()
        run: |
          npx tsx scripts/dom-reality-ci-integration.ts test-results/dom-reality-reports exit
        continue-on-error: false
