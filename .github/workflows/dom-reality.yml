name: DOM Reality Enforcement

on:
  pull_request:
    paths:
      - 'packages/web/**'
      - 'tests/e2e/dom-reality-enforcement.spec.ts'
      - 'tests/utils/dom-reality-utils.ts'
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/web/**'
      - 'tests/e2e/dom-reality-enforcement.spec.ts'
  workflow_dispatch:

jobs:
  dom-reality:
    name: DOM Reality Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start development server
        run: |
          npm run dev --workspace=packages/web &
          echo $! > server.pid
        env:
          NODE_ENV: test

      - name: Wait for server
        run: |
          timeout=120
          elapsed=0
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "Server failed to start within $timeout seconds"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Server is ready"

      - name: Run DOM reality tests
        run: npm run qa:dom-reality
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: true
        continue-on-error: true

      - name: Generate report
        if: always()
        run: npm run qa:dom-reality:report
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-reality-results
          path: |
            test-results/
          retention-days: 30

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-reality-report
          path: |
            test-results/dom-reality-report.md
            test-results/dom-reality-report.json
          retention-days: 30

      - name: Comment PR with report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const reportPath = path.join(process.cwd(), 'test-results', 'dom-reality-report.md');
              if (fs.existsSync(reportPath)) {
                const report = fs.readFileSync(reportPath, 'utf-8');
                const body = `## 🔍 DOM Reality Report\n\n\`\`\`\n${report}\n\`\`\``;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      - name: Fail on critical issues
        if: always()
        run: |
          if [ -f test-results/dom-reality-report.json ]; then
            critical=$(node -e "const r=require('./test-results/dom-reality-report.json'); console.log(r.summary.criticalIssues)")
            if [ "$critical" -gt 0 ]; then
              echo "❌ Found $critical critical DOM reality issue(s)"
              exit 1
            fi
          fi
