name: Operator Mode Daily Job

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run job in"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  operator-mode-daily:
    name: Operator Mode Daily Job
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API package
        run: |
          cd packages/api
          npx turbo run build

      - name: Run Operator Mode Daily Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          BACKUP_DIR: /tmp/backups
        run: |
          echo "🔄 Running operator mode daily job..."
          cd packages/api
          npm run operator-mode:daily || {
            echo "⚠️ Daily job script failed, trying direct execution..."
            npx tsx src/jobs/operator-mode-daily.ts
          }
          echo "✅ Daily job completed"

      - name: Job summary
        if: success()
        run: |
          echo "## ✅ Operator Mode Daily Job Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tasks Completed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Daily intelligence generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Alert thresholds checked" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Daily backup scheduled" >> $GITHUB_STEP_SUMMARY

      - name: Job failed
        if: failure()
        run: |
          echo "## ❌ Operator Mode Daily Job Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ Daily job execution failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
