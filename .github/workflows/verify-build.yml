name: Verify Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      - name: Install dependencies
        run: npm ci

      - name: Detect unresolved conflict markers
        run: npm run verify:conflict-markers

  verify:
    needs: conflict-markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      - name: Install dependencies
        run: npm ci

      - name: Check for committed node_modules
        run: |
          if git ls-files | grep -q node_modules; then
            echo "❌ Error: node_modules files are committed to git"
            git ls-files | grep node_modules | head -20
            exit 1
          fi
          echo "✅ No node_modules files are tracked in git"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npx turbo run build

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Marketing crawl regression guard
        run: npm run test:e2e -- --project=chromium tests/e2e/marketing-crawl.spec.ts

      - name: Verify content routes in production mode
        run: npm run test --workspace=packages/web -- src/__tests__/integration/content-pages.production.test.ts

      - name: Validate
        run: npm run validate

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build wasm verifier
        run: cargo build -p settler-verify-wasm --target wasm32-unknown-unknown
