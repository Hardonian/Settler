name: Complete Billing System Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Generate Prisma
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prisma Migrate
        run: npm run prisma:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Link Supabase
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Seed Add-Ons
        run: npx tsx scripts/post-migration-seed.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true

      - name: Setup Stripe Products
        if: env.STRIPE_SECRET_KEY != ''
        run: npx tsx scripts/auto-setup-stripe.ts
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        continue-on-error: true

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy log-usage --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy compute-bill --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy trigger-upgrade-alert --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy sync-usage-to-stripe --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy integration-sync-stripe --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy integration-sync-shopify --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy integration-sync-paypal --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy integration-sync-tiktok --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Initialize
        run: npx tsx scripts/init-billing-system.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        continue-on-error: true

      - name: Success
        run: |
          echo "✅ Billing system deployed!"
          echo "Next: Configure Stripe webhook at https://your-domain.com/api/billing/webhook"
