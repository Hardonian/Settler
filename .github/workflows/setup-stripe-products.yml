name: Setup Stripe Products

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/setup-stripe-products.ts'
      - '.github/workflows/setup-stripe-products.yml'

jobs:
  setup-stripe:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Stripe Products
        run: npx tsx scripts/setup-stripe-products.ts
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Output Product IDs
        run: |
          echo "Stripe products created. Add the output product/price IDs to your environment variables."
