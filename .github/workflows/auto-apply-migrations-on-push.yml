name: Auto-Apply Migrations on Push

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  apply-migrations:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect new migrations
        id: detect
        run: |
          echo "🔍 Detecting new migration files..."
          
          # Get list of all migration files
          MIGRATION_FILES=$(find supabase/migrations -name "*.sql" -type f | sort)
          MIGRATION_COUNT=$(echo "$MIGRATION_FILES" | wc -l)
          
          echo "Found $MIGRATION_COUNT migration file(s)"
          echo "migration_count=$MIGRATION_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "⚠️  No migration files found"
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          else
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "📦 Migration files:"
            echo "$MIGRATION_FILES" | while read file; do
              echo "  - $(basename $file)"
            done
          fi

      - name: Link Supabase project
        if: steps.detect.outputs.has_migrations == 'true'
        run: |
          echo "🔗 Linking to Supabase project: ${{ env.SUPABASE_PROJECT_REF }}"
          supabase link --project-ref ${{ env.SUPABASE_PROJECT_REF }} || {
            echo "⚠️  Failed to link project, will use direct connection"
          }
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Apply migrations
        if: steps.detect.outputs.has_migrations == 'true'
        run: |
          echo "🔄 Applying migrations to Supabase database..."
          echo "Project: ${{ env.SUPABASE_PROJECT_REF }}"
          
          # Try using Supabase CLI first
          supabase db push --include-all || {
            echo "⚠️  Supabase CLI push failed, trying direct psql connection..."
            
            # Fallback: apply migrations directly via psql
            for file in supabase/migrations/*.sql; do
              if [ -f "$file" ]; then
                echo "Applying: $(basename $file)"
                psql "${{ env.DATABASE_URL }}" -f "$file" && echo "✅ Applied $(basename $file)" || {
                  echo "❌ Failed to apply $(basename $file)"
                  exit 1
                }
              fi
            done
          }
          
          echo "✅ All migrations applied successfully"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
          PGPASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}

      - name: Verify migrations
        if: steps.detect.outputs.has_migrations == 'true'
        run: |
          echo "🔍 Verifying migration status..."
          
          # Check migration status
          if command -v supabase > /dev/null; then
            supabase migration list || echo "⚠️  Could not list migrations"
          fi
          
          # Verify key tables exist
          echo "Checking database schema..."
          psql "${{ env.DATABASE_URL }}" -c "\dt" | head -30 || echo "⚠️  Could not verify schema"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
          PGPASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}
        continue-on-error: true

      - name: Migration summary
        if: steps.detect.outputs.has_migrations == 'true'
        run: |
          echo "## ✅ Migrations Applied" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ env.SUPABASE_PROJECT_REF }}" >> $GITHUB_STEP_SUMMARY
          echo "**Migrations Applied:** ${{ steps.detect.outputs.migration_count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Applied At:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All migrations have been successfully applied to the database." >> $GITHUB_STEP_SUMMARY

      - name: Skip migrations
        if: steps.detect.outputs.has_migrations == 'false'
        run: |
          echo "ℹ️  No migration files detected in this push"
          echo "Skipping migration step"
