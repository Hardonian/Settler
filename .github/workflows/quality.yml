name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: cd packages/web && npm run lint

      - name: Typecheck
        run: cd packages/web && npm run typecheck

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Check for Exposed Secrets
        run: |
          if grep -r "sk_live_" . ; then
            echo "POTENTIAL SECRET LEAK: Found 'sk_live_' in code."
            exit 1
          fi
          if grep -r "sk_test_" . ; then
            echo "POTENTIAL SECRET LEAK: Found 'sk_test_' in code."
            exit 1
          fi
          echo "PASS: No obvious secret patterns found."
