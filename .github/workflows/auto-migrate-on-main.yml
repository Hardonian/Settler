name: Auto-Migrate on Main

on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "supabase/migrations/**"
      - "supabase/.temp/pooler-url"
      - "supabase/.temp/project-ref"
      - "scripts/prisma-migrate-via-supabase-pooler.mjs"
      - "scripts/supabase-migration-contract.mjs"
      - ".github/workflows/auto-migrate-on-main.yml"
  workflow_dispatch:
    inputs:
      apply_prisma:
        description: "Apply pending Prisma migrations"
        required: true
        default: true
        type: boolean

concurrency:
  group: settler-production-database-migrations
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    name: Migrate Production Database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: changes
        env:
          REQUESTED_PRISMA: ${{ inputs.apply_prisma }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SUPABASE_MIGRATIONS=""
            if [ "$REQUESTED_PRISMA" = "true" ]; then
              HAS_PRISMA=true
            else
              HAS_PRISMA=false
            fi
          else
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              ALL_CHANGES=$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")
              ADDED_CHANGES=$(git diff-tree --root --no-commit-id --name-only --diff-filter=A -r "$CURRENT_SHA")
              IMMUTABLE_CANDIDATES=$(git diff-tree --root --no-commit-id --name-only --diff-filter=MDR -r "$CURRENT_SHA")
            else
              ALL_CHANGES=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
              ADDED_CHANGES=$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$CURRENT_SHA")
              IMMUTABLE_CANDIDATES=$(git diff --name-only --diff-filter=MDR "$BEFORE_SHA" "$CURRENT_SHA")
            fi

            IMMUTABLE_CHANGES=$(echo "$IMMUTABLE_CANDIDATES" \
              | grep -E '^(prisma/migrations/.+/migration\.sql|supabase/migrations/[^/]+\.sql)$' || true)
            if [ -n "$IMMUTABLE_CHANGES" ]; then
              echo "::error::Applied migration files are immutable; add a new migration instead"
              echo "$IMMUTABLE_CHANGES"
              exit 1
            fi

            SUPABASE_MIGRATIONS=$(echo "$ADDED_CHANGES" \
              | grep -E '^supabase/migrations/[^/]+\.sql$' \
              | sort || true)
            PRISMA_MIGRATIONS=$(echo "$ADDED_CHANGES" \
              | grep -E '^prisma/migrations/[0-9]{14}_[^/]+/migration\.sql$' \
              | sort || true)
            PRISMA_SCHEMA_CHANGED=$(echo "$ALL_CHANGES" | grep -Fx 'prisma/schema.prisma' || true)

            if [ -n "$PRISMA_SCHEMA_CHANGED" ] && [ -z "$PRISMA_MIGRATIONS" ]; then
              echo "::error file=prisma/schema.prisma::Schema changed without a new Prisma migration"
              exit 1
            fi
            if [ -n "$PRISMA_MIGRATIONS" ]; then HAS_PRISMA=true; else HAS_PRISMA=false; fi
          fi

          if [ -n "$SUPABASE_MIGRATIONS" ]; then HAS_SUPABASE=true; else HAS_SUPABASE=false; fi
          echo "has_prisma=$HAS_PRISMA" >> "$GITHUB_OUTPUT"
          echo "has_supabase=$HAS_SUPABASE" >> "$GITHUB_OUTPUT"
          {
            echo "supabase_files<<EOF"
            echo "$SUPABASE_MIGRATIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Prisma migrations: $HAS_PRISMA"
          echo "Supabase migrations: $HAS_SUPABASE"
          if [ -n "$SUPABASE_MIGRATIONS" ]; then printf '  %s\n' $SUPABASE_MIGRATIONS; fi

      - name: Setup Node.js
        if: steps.changes.outputs.has_prisma == 'true' || steps.changes.outputs.has_supabase == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Validate migration credentials
        if: steps.changes.outputs.has_prisma == 'true' || steps.changes.outputs.has_supabase == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_CREDENTIAL_SOURCE: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ steps.changes.outputs.has_supabase }}" = "true" ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
              echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are required"
              exit 1
            fi
          fi

          if [ "${{ steps.changes.outputs.has_prisma }}" = "true" ]; then
            node scripts/prisma-migrate-via-supabase-pooler.mjs check
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.has_prisma == 'true'
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        if: steps.changes.outputs.has_prisma == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        if: steps.changes.outputs.has_prisma == 'true'
        env:
          DATABASE_CREDENTIAL_SOURCE: ${{ secrets.DATABASE_URL }}
        run: node scripts/prisma-migrate-via-supabase-pooler.mjs deploy

      - name: Install Supabase CLI
        if: steps.changes.outputs.has_supabase == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Validate Supabase migrations
        if: steps.changes.outputs.has_supabase == 'true'
        env:
          MIGRATION_FILES: ${{ steps.changes.outputs.supabase_files }}
        run: |
          readarray -t files <<< "$MIGRATION_FILES"
          node scripts/supabase-migration-contract.mjs validate "${files[@]}"

      - name: Apply Supabase migrations
        if: steps.changes.outputs.has_supabase == 'true'
        env:
          MIGRATION_FILES: ${{ steps.changes.outputs.supabase_files }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p artifacts/migrations
          readarray -t files <<< "$MIGRATION_FILES"
          node scripts/supabase-migration-contract.mjs deploy \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --commit-sha "${{ github.sha }}" \
            --evidence artifacts/migrations/production.json \
            "${files[@]}"

      - name: Upload migration evidence
        if: always() && steps.changes.outputs.has_supabase == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: production-migration-evidence-${{ github.run_id }}
          path: artifacts/migrations/production.json
          if-no-files-found: warn
          retention-days: 90

      - name: Migration summary
        if: always()
        run: |
          {
            echo "## Production migration summary"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Prisma requested: \`${{ steps.changes.outputs.has_prisma || 'false' }}\`"
            echo "- Supabase requested: \`${{ steps.changes.outputs.has_supabase || 'false' }}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update failure issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🚨 Production database migration failed';
            const marker = `<!-- settler-migration-failure:${context.ref} -->`;
            const body = `${marker}
            ## Production migration failure

            - Commit: \`${context.sha}\`
            - Ref: \`${context.ref}\`
            - Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            The workflow failed closed. No later migration was attempted after the failing step.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'migration-failure',
              per_page: 20,
            });
            const existing = issues.find((issue) => (issue.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'migration-failure', 'urgent', 'production'],
              });
            }
