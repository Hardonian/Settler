name: Complete Billing System Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Prisma Migrations
        run: npm run prisma:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Deploy Supabase Migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Seed Add-Ons
        run: npm run billing:seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true

      - name: Setup Stripe Products (if Stripe key exists)
        if: env.STRIPE_SECRET_KEY != ''
        run: npm run billing:auto-setup
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        continue-on-error: true

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy log-usage --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy compute-bill --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy trigger-upgrade-alert --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy sync-usage-to-stripe --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy integration-sync-stripe --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy integration-sync-shopify --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy integration-sync-paypal --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase functions deploy integration-sync-tiktok --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Initialize Billing System
        run: npm run billing:init
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        continue-on-error: true

      - name: Verify Deployment
        run: npx tsx scripts/verify-deployment.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        continue-on-error: true

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed!"
          echo "📝 Next steps:"
          echo "   1. Verify Stripe products were created"
          echo "   2. Configure Stripe webhook endpoint: https://your-domain.com/api/billing/webhook"
          echo "   3. Test billing flow end-to-end"
