name: Classification Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  classify:
    name: Classify Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: false
      - run: npm ci
      - name: Run classification
        run: npm run classify:strict
      - name: Upload classification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classification-report
          path: artifacts/classification-report.json
      - name: Upload classification summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classification-summary
          path: artifacts/classification-summary.md
      - name: Check for violations
        run: |
          if [ -f artifacts/classification-report.json ]; then
            VIOLATIONS=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('artifacts/classification-report.json')); console.log(d.violations.length);")
            if [ "$VIOLATIONS" -gt 0 ]; then
              echo "❌ Found $VIOLATIONS violations"
              exit 1
            fi
          fi
      - name: Check for SECRET_RISK
        run: |
          if [ -f artifacts/classification-report.json ]; then
            SECRET_RISK=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('artifacts/classification-report.json')); console.log(d.summary.secret_risk);")
            if [ "$SECRET_RISK" -gt 0 ]; then
              echo "❌ CRITICAL: Found $SECRET_RISK SECRET_RISK files"
              echo "::error::SECRET_RISK files detected. Review classification report."
              exit 1
            fi
          fi
      
      - name: Generate fix suggestions
        if: failure()
        run: |
          npm run classify:fix-suggestions || echo "⚠️  Could not generate fix suggestions"
        continue-on-error: true
      
      - name: Comment PR with fix suggestions
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            try {
              const suggestions = execSync('npm run classify:fix-suggestions', { encoding: 'utf-8' });
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔧 Fix Suggestions\n\n\`\`\`\n${suggestions}\n\`\`\``
              });
            } catch (error) {
              // Ignore errors
            }
