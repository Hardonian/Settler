name: Apply Operator Mode Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply migration to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260131000001_operator_mode.sql'
      - 'packages/api/src/services/operator-mode/**'
      - '.github/workflows/apply-operator-mode-migration.yml'

jobs:
  apply-migration:
    name: Apply Operator Mode Migration
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'


      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Operator Mode Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔍 Applying operator mode migration..."
          export PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
          psql "${{ secrets.DATABASE_URL }}" -f supabase/migrations/20260131000001_operator_mode.sql
          echo "✅ Migration applied successfully"

      - name: Verify Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔍 Verifying migration..."
          export PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
          psql "${{ secrets.DATABASE_URL }}" -c "
            SELECT table_name 
            FROM information_schema.tables 
            WHERE table_schema = 'public' 
              AND table_name IN (
                'alert_rules',
                'alert_history',
                'tenant_usage_ceilings',
                'background_job_limits',
                'kill_switches',
                'backup_records',
                'daily_intelligence'
              )
            ORDER BY table_name;
          "
          echo "✅ All operator mode tables verified"

      - name: Verify Indexes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔍 Verifying indexes..."
          export PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
          psql "${{ secrets.DATABASE_URL }}" -c "
            SELECT indexname, tablename
            FROM pg_indexes
            WHERE schemaname = 'public'
              AND tablename IN (
                'alert_rules',
                'alert_history',
                'tenant_usage_ceilings',
                'background_job_limits',
                'kill_switches',
                'backup_records',
                'daily_intelligence'
              )
            ORDER BY tablename, indexname;
          "

      - name: Create migration summary
        if: success()
        run: |
          echo "## ✅ Operator Mode Migration Applied Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tables Created:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ alert_rules" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ alert_history" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ tenant_usage_ceilings" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ background_job_limits" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ kill_switches" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ backup_records" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ daily_intelligence" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Run setup script to configure default alert rules: \`npm run operator-mode:setup-alerts\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify daily job workflow is enabled" >> $GITHUB_STEP_SUMMARY
          echo "3. Test kill switches: \`npm run test:operator-mode\`" >> $GITHUB_STEP_SUMMARY

      - name: Migration failed
        if: failure()
        run: |
          echo "## ❌ Operator Mode Migration Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ Migration execution failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting:" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify DATABASE_URL secret is set correctly in GitHub Actions secrets" >> $GITHUB_STEP_SUMMARY
          echo "2. Check database connectivity and permissions" >> $GITHUB_STEP_SUMMARY
          echo "3. Review migration SQL for syntax errors" >> $GITHUB_STEP_SUMMARY
          echo "4. Verify migration file exists: \`supabase/migrations/20260131000001_operator_mode.sql\`" >> $GITHUB_STEP_SUMMARY
