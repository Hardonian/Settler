name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to protect (default: main)'
        required: false
        default: 'main'
      github_token:
        description: 'GitHub token with repo admin permissions'
        required: true
        type: string

jobs:
  setup-protection:
    name: Setup Branch Protection Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Branch Protection
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          TOKEN="${{ github.event.inputs.github_token }}"
          
          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi
          
          echo "🔒 Setting up branch protection for: $BRANCH"
          
          # Create branch protection rule via GitHub API
          curl -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/branches/$BRANCH/protection" \
            -d '{
              "required_status_checks": {
                "strict": true,
                "contexts": [
                  "ci / lint-and-typecheck",
                  "ci / test",
                  "ci / build",
                  "classify / classify",
                  "smoke / smoke"
                ]
              },
              "enforce_admins": false,
              "required_pull_request_reviews": {
                "required_approving_review_count": 1,
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false
              },
              "restrictions": null,
              "allow_force_pushes": false,
              "allow_deletions": false
            }' || echo "⚠️  Failed to set branch protection (may need manual setup)"
          
          echo "✅ Branch protection configured"
