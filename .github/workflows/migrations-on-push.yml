name: Auto-Apply Migrations on Push to Main

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**/*.sql'

jobs:
  apply-migrations-on-push:
    name: Apply Migrations on Push to Main
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify DATABASE_URL secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "❌ Error: DATABASE_URL secret is not configured"
            echo "Please add DATABASE_URL to GitHub repository secrets:"
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "✅ DATABASE_URL secret is configured"

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔌 Applying migrations via pooler connection..."
          echo "📝 Migration files changed in this push:"
          git diff --name-only HEAD~1 HEAD | grep 'supabase/migrations/.*\.sql$' || echo "  (checking all pending migrations)"
          npm run db:migrate:pooler

      - name: Verify migrations applied
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "✅ Verifying migrations..."
          npx tsx -e "
            import { Client } from 'pg';
            const client = new Client({ 
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false }
            });
            await client.connect();
            const result = await client.query(
              'SELECT COUNT(*) as count FROM supabase_migrations.schema_migrations'
            );
            console.log(\`📊 Total migrations applied: \${result.rows[0].count}\`);
            await client.end();
          "

      - name: Create deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: status,
              description: status === 'success' 
                ? 'Database migrations applied successfully' 
                : 'Database migrations failed'
            });
