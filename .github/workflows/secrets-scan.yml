name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run gitleaks (OSS CLI)
        # gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE secret and
        # fails open when it is absent. The OSS gitleaks CLI performs the same
        # scan with our .gitleaks.toml and needs no license.
        uses: gitleaks/gitleaks@v8
        with:
          config-path: .gitleaks.toml
          exit-code: "1"
          verbose: true
