name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
