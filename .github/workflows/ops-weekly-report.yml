name: Founder Weekly Report

on:
  schedule:
    # Run weekly on Monday at 07:40 America/Toronto (11:40 UTC)
    - cron: "40 11 * * 1"
  workflow_dispatch:

jobs:
  generate-weekly-report:
    name: Generate Founder Weekly Report
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Weekly Report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo "📊 Generating Founder Weekly Report..."
          npm run ops:weekly || {
            echo "⚠️ Report generation failed, but continuing..."
            exit 0  # Don't fail the workflow, just log
          }

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founders-weekly-report-${{ github.run_number }}
          path: |
            ops/reports/FOUNDERS_WEEKLY_REPORT.md
            ops/reports/FOUNDERS_WEEKLY_REPORT.json
          retention-days: 90

      - name: Report Summary
        if: success()
        run: |
          echo "## ✅ Founder Weekly Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Report artifacts uploaded. Check the workflow artifacts to download." >> $GITHUB_STEP_SUMMARY

      - name: Report Failed
        if: failure()
        run: |
          echo "## ❌ Founder Weekly Report Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ Weekly report generation failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
