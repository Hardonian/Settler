name: E2E & Visual Regression Tests

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
      - "business/**"
      - "marketing/**"
      - "strategic/**"
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
      - "business/**"
      - "marketing/**"
      - "strategic/**"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: settler_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npx turbo run build

      - name: Sync test database schema
        run: pnpm exec prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
          NODE_ENV: test
          JWT_SECRET: test-secret-min-32-chars-long-for-testing
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!!

      - name: Seed test data
        run: |
          # Seed test data for E2E tests
          cd packages/api
          npm run seed || echo "⚠️  Seed script not found, skipping"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
          NODE_ENV: test
        continue-on-error: true

      - name: Start API server
        run: |
          nohup pnpm --dir packages/api start >/tmp/settler-api.log 2>&1 &
          echo $! >/tmp/settler-api.pid
          echo "Waiting for API server to start..."
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4000/health >/dev/null; then
              echo "✅ API server is ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/settler-api.pid)" 2>/dev/null; then
              cat /tmp/settler-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/settler-api.log
          exit 1
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-min-32-chars-long-for-testing
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test-anon-key-for-e2e
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-for-e2e

      - name: Run E2E tests
        run: pnpm run test:e2e -- --project=chromium
        env:
          E2E_API_KEY: test-api-key
          E2E_BASE_URL: http://localhost:3000
          API_URL: http://localhost:4000

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  demo-mode:
    name: Demo Mode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npx turbo run build

      - name: Generate demo data
        run: npx tsx scripts/seed-demo.ts
        env:
          DEMO_MODE: true
          DEMO_SEED: 42

      - name: Run demo mode E2E tests
        run: pnpm run test:e2e -- --project=demo-mode
        env:
          DEMO_MODE: true
          E2E_API_KEY: demo-key-for-testing-only
          E2E_BASE_URL: http://localhost:3000

      - name: Upload demo test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-mode-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [e2e]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: settler_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npx turbo run build

      - name: Sync test database schema
        run: pnpm exec prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
          NODE_ENV: test
          JWT_SECRET: test-secret-min-32-chars-long-for-testing
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!!

      - name: Seed test data
        run: |
          cd packages/api
          npm run seed || echo "⚠️  Seed script not found, skipping"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
          NODE_ENV: test
        continue-on-error: true

      - name: Start API server
        run: |
          nohup pnpm --dir packages/api start >/tmp/settler-api.log 2>&1 &
          echo $! >/tmp/settler-api.pid
          echo "Waiting for API server to start..."
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4000/health >/dev/null; then
              echo "✅ API server is ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/settler-api.pid)" 2>/dev/null; then
              cat /tmp/settler-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/settler-api.log
          exit 1
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-min-32-chars-long-for-testing
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test-anon-key-for-e2e
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-for-e2e

      - name: Run visual regression tests
        run: pnpm run test:visual || echo "⚠️  Visual tests not configured yet"
        continue-on-error: true
        env:
          E2E_API_KEY: test-api-key
          E2E_BASE_URL: http://localhost:3000
          API_URL: http://localhost:4000
          WEB_BASE_URL: http://localhost:3000

      - name: Upload visual test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-test-results
          path: |
            playwright-report/
            test-results/
            visual-baselines/
          retention-days: 30
