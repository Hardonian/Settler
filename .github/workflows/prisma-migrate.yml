name: Prisma Database Migrations

on:
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - 'prisma.config.ts'

jobs:
  run-prisma-migrations:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    environment: production # Uses production environment secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'


      - name: Install dependencies
        run: npm ci

      - name: Check Prisma migrations status (before)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔍 Checking Prisma migration status (before)..."
          npx prisma migrate status || echo "⚠️  Status check failed (may be expected if no migrations exist)"
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### Pre-Migration Status" >> $GITHUB_STEP_SUMMARY
          npx prisma migrate status >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No migrations or connection issue" >> $GITHUB_STEP_SUMMARY

      - name: Run Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔄 Running Prisma migrations..."
          npm run prisma:migrate
          echo "✅ Prisma migrations completed"

      - name: Verify Prisma migrations status (after)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔍 Verifying Prisma migration status (after)..."
          npx prisma migrate status
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### Post-Migration Status" >> $GITHUB_STEP_SUMMARY
          npx prisma migrate status >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Verify database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔍 Verifying database schema..."
          # Check if _prisma_migrations table exists (indicates Prisma is set up)
          npx prisma db execute --stdin <<< "SELECT COUNT(*) as migration_count FROM _prisma_migrations;" || echo "⚠️  Could not query migrations table"
          
          # Try to list some tables to verify connection
          npx prisma db execute --stdin <<< "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' LIMIT 5;" || echo "⚠️  Could not list tables"

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📦 Generating Prisma Client..."
          npx prisma generate
          echo "✅ Prisma Client generated"

      - name: Create migration summary
        if: success()
        run: |
          echo "## ✅ Prisma Migrations Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Database:** Supabase PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "**Host:** db.johfcvvmtfiomzxipspz.supabase.co" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Prisma migrations have been applied successfully." >> $GITHUB_STEP_SUMMARY

      - name: Migration failed
        if: failure()
        run: |
          echo "## ❌ Prisma Migrations Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ Migration execution failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
