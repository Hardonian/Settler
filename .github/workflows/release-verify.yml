name: release-verify

on:
  push:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:
    inputs:
      capture_base_url:
        description: Optional externally hosted URL for launch capture
        required: false
        type: string
      allow_audit_soft_skip:
        description: Allow release to continue when registry audit endpoint is unavailable
        required: false
        default: false
        type: boolean

jobs:
  verify-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fast verification
        run: pnpm run verify:fast -- --run-id=ci-fast-${{ github.run_id }}
      - name: Upload fast verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-${{ github.run_id }}
          path: artifacts/verification/

  verify-internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Internal link integrity (route registry + dead links)
        run: pnpm run verify:internal-links

  security-supply-chain:
    runs-on: ubuntu-latest
    needs:
      - verify-fast
      - verify-internal-links
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency CVE scan + SBOM generation
        env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          SECURITY_AUDIT_FAIL_LEVEL: high
          SECURITY_AUDIT_CONTEXT: release
          SECURITY_AUDIT_ALLOW_UNAVAILABLE: ${{ github.event.inputs.allow_audit_soft_skip == 'true' && '1' || '0' }}
          SECURITY_AUDIT_ALLOW_UNAVAILABLE_ON_RELEASE: ${{ github.event.inputs.allow_audit_soft_skip == 'true' && '1' || '0' }}
        run: pnpm run verify:security:supply-chain
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-supply-chain-${{ github.run_id }}
          path: artifacts/security/

  verify-release:
    runs-on: ubuntu-latest
    needs:
      - verify-fast
      - verify-internal-links
      - security-supply-chain
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download supply-chain evidence
        uses: actions/download-artifact@v4
        with:
          name: security-supply-chain-${{ github.run_id }}
          path: artifacts/security/
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Run release verification
        env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          RELEASE_REQUIRE_SECURITY_EVIDENCE: "1"
          RELEASE_ALLOW_AUDIT_UNAVAILABLE: ${{ github.event.inputs.allow_audit_soft_skip == 'true' && '1' || '0' }}
          LAUNCH_CAPTURE_BASE_URL: ${{ github.event.inputs.capture_base_url || 'http://127.0.0.1:3000' }}
        run: pnpm run verify:release -- --run-id=ci-release-${{ github.run_id }}
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-release-${{ github.run_id }}
          path: |
            artifacts/verification/
            artifacts/launch/
            artifacts/security/
