name: Apply Database Migrations

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply migrations"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  apply-migrations:
    name: Apply Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'false'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install Supabase CLI
        run: |
          pnpm add -g supabase@latest
          supabase --version

      - name: Verify Supabase CLI installation
        run: supabase --version

      - name: Apply migrations to staging
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Applying migrations to staging environment..."

          # Use psql directly if SUPABASE_DB_URL is provided
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Using direct PostgreSQL connection..."
            export PGPASSWORD="$SUPABASE_DB_PASSWORD"
            
            # Get list of migration files
            MIGRATIONS=$(ls -1 supabase/migrations/*.sql | sort)
            
            for migration in $MIGRATIONS; do
              echo "Applying migration: $(basename $migration)"
              psql "$SUPABASE_DB_URL" -f "$migration" || {
                echo "Migration failed: $migration"
                exit 1
              }
            done
            
            echo "All migrations applied successfully!"
          else
            echo "Using Supabase CLI..."
            supabase db push --db-url "$SUPABASE_DB_URL" || {
              echo "Migration failed"
              exit 1
            }
          fi

      - name: Apply migrations to production
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_PRODUCTION }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "⚠️  Applying migrations to PRODUCTION environment..."
          echo "This requires manual approval..."

          # Use psql directly if SUPABASE_DB_URL is provided
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Using direct PostgreSQL connection..."
            export PGPASSWORD="$SUPABASE_DB_PASSWORD"
            
            # Get list of migration files
            MIGRATIONS=$(ls -1 supabase/migrations/*.sql | sort)
            
            for migration in $MIGRATIONS; do
              echo "Applying migration: $(basename $migration)"
              psql "$SUPABASE_DB_URL" -f "$migration" || {
                echo "Migration failed: $migration"
                exit 1
              }
            done
            
            echo "All migrations applied successfully to production!"
          else
            echo "Using Supabase CLI..."
            supabase db push --db-url "$SUPABASE_DB_URL" || {
              echo "Migration failed"
              exit 1
            }
          fi

      - name: Verify migrations
        env:
          SUPABASE_DB_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && secrets.SUPABASE_DB_URL_PRODUCTION || secrets.SUPABASE_DB_URL_STAGING }}
          SUPABASE_DB_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && secrets.SUPABASE_DB_PASSWORD_PRODUCTION || secrets.SUPABASE_DB_PASSWORD_STAGING }}
        run: |
          echo "Verifying migrations..."
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"

          # Check if key tables exist
          psql "$SUPABASE_DB_URL" -c "
            SELECT 
              CASE 
                WHEN EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'receipts') THEN '✓ receipts table exists'
                ELSE '✗ receipts table missing'
              END as receipts_check,
              CASE 
                WHEN EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'ai_analysis_usage') THEN '✓ ai_analysis_usage table exists'
                ELSE '✗ ai_analysis_usage table missing'
              END as ai_tokens_check,
              CASE 
                WHEN EXISTS (SELECT FROM pg_proc WHERE proname = 'set_tenant_context') THEN '✓ set_tenant_context function exists'
                ELSE '✗ set_tenant_context function missing'
              END as function_check;
          " || echo "Verification query failed (non-critical)"

      - name: Migration Summary
        if: always()
        run: |
          echo "## Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Migrations Applied**: $(ls -1 supabase/migrations/*.sql | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
