name: Billing System Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-billing:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Prisma Migrations
        run: npm run prisma:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy Supabase Migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Seed Add-Ons
        run: npx tsx scripts/post-migration-seed.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true

      - name: Setup Stripe Products
        if: env.STRIPE_SECRET_KEY != ''
        run: npx tsx scripts/auto-setup-stripe.ts
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        continue-on-error: true

      - name: Deploy Edge Functions
        run: |
          echo "Deploying edge functions..."
          supabase functions deploy log-usage --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "log-usage deploy skipped"
          supabase functions deploy compute-bill --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "compute-bill deploy skipped"
          supabase functions deploy trigger-upgrade-alert --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "trigger-upgrade-alert deploy skipped"
          supabase functions deploy sync-usage-to-stripe --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "sync-usage-to-stripe deploy skipped"
          supabase functions deploy integration-sync-stripe --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "integration-sync-stripe deploy skipped"
          supabase functions deploy integration-sync-shopify --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "integration-sync-shopify deploy skipped"
          supabase functions deploy integration-sync-paypal --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "integration-sync-paypal deploy skipped"
          supabase functions deploy integration-sync-tiktok --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "integration-sync-tiktok deploy skipped"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Initialize Billing System
        run: npx tsx scripts/init-billing-system.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        continue-on-error: true

      - name: Deployment Complete
        run: |
          echo "✅ Billing system deployment completed!"
          echo ""
          echo "📝 Next steps:"
          echo "   1. Verify Stripe products in Stripe Dashboard"
          echo "   2. Configure webhook: https://your-domain.com/api/billing/webhook"
          echo "   3. Add STRIPE_WEBHOOK_SECRET to GitHub Secrets"
          echo "   4. Test billing flow end-to-end"
