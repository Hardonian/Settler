name: Verify Baseline Schema

on:
  pull_request:
    paths:
      - "supabase/migrations/00000000000000_consolidated_baseline.sql"
      - "scripts/verify-rls.ts"
      - ".github/workflows/verify-baseline-schema.yml"
  workflow_dispatch:

jobs:
  test-baseline-and-rls:
    name: Test Migration Syntax & RLS
    runs-on: ubuntu-latest

    # Spin up a fresh Postgres instance for the test
    services:
      postgres:
        image: postgres:15
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Consolidated Baseline Schema
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          PGPASSWORD: testpassword
        # -v ON_ERROR_STOP=1 ensures the script fails if any SQL command fails
        run: |
          psql -h localhost -U postgres -d settler_test -v ON_ERROR_STOP=1 -f supabase/migrations/00000000000000_consolidated_baseline.sql

      - name: Run Dynamic RLS Verification
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/settler_test
        # Using npx tsx as it is already being used in schema-parity-check.yml
        run: npx tsx scripts/verify-rls.ts
