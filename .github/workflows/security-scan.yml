name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
          generateSarif: "1"
        # Semgrep findings are informational; uploaded to Security tab for triage.
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (informational - all severities)
        run: |
          pnpm audit --json > pnpm-audit.json 2>&1 || true
          pnpm audit --audit-level=moderate || echo "::warning::pnpm audit found moderate+ vulnerabilities"

      - name: Run pnpm audit (blocking - production high/critical)
        run: pnpm audit --prod --audit-level=high

  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        # TruffleHog is supplementary to Gitleaks; do not double-block.
        continue-on-error: true

  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for problematic licenses
        run: |
          npx license-checker --json > license-report.json 2>/dev/null || true
          if [ -f license-report.json ]; then
            PROBLEMATIC=$(jq -r 'to_entries[] | select(.value.licenses | test("GPL|AGPL")) | .key' license-report.json 2>/dev/null | wc -l)
            if [ "$PROBLEMATIC" -gt 0 ]; then
              echo "::warning::Found $PROBLEMATIC packages with copyleft licenses"
              jq -r 'to_entries[] | select(.value.licenses | test("GPL|AGPL")) | "\(.key): \(.value.licenses)"' license-report.json
            fi
          fi

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, secrets-scan, license-scan]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          cat <<'REPORT' > security-report.md
          # Security Scan Report

          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Scan Results

          | Check | Result | Blocking? |
          |---|---|---|
          | SAST (Semgrep) | ${{ needs.sast.result }} | No (informational) |
          | Dependency Scan | ${{ needs.dependency-scan.result }} | Yes (prod high/critical) |
          | Secrets Scan | ${{ needs.secrets-scan.result }} | Yes (Gitleaks) |
          | License Scan | ${{ needs.license-scan.result }} | No (informational) |

          Blocking checks will fail the workflow. Informational checks upload results
          to the GitHub Security tab for manual triage.
          REPORT

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
