name: Migrate on Comment

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      force_migrate:
        description: 'Force migration even if no new migrations detected'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}

jobs:
  check-trigger:
    name: Check if migration requested
    runs-on: ubuntu-latest
    outputs:
      should_migrate: ${{ steps.check.outputs.should_migrate }}
    steps:
      - name: Check comment for migrate command
        id: check
        if: github.event_name == 'issue_comment'
        run: |
          COMMENT_BODY="${{ github.event.comment.body }}"
          if echo "$COMMENT_BODY" | grep -qiE "^\s*migrate\s*$|^\s*/migrate\s*$"; then
            echo "should_migrate=true" >> $GITHUB_OUTPUT
            echo "✅ Migration command detected"
          else
            echo "should_migrate=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No migration command found"
          fi
      
      - name: Always migrate on workflow_dispatch
        id: check-dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "should_migrate=true" >> $GITHUB_OUTPUT

  migrate:
    name: Run Supabase Migrations
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_migrate == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: |
          if [ -z "${{ env.SUPABASE_PROJECT_REF }}" ]; then
            echo "⚠️  SUPABASE_PROJECT_REF not set, skipping link"
          else
            echo "Linking to Supabase project..."
            supabase link --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Check current migration status
        id: check-status
        run: |
          echo "Checking migration status..."
          if [ -n "${{ env.SUPABASE_PROJECT_REF }}" ] && [ -n "${{ env.SUPABASE_ACCESS_TOKEN }}" ]; then
            supabase migration list --project-ref ${{ env.SUPABASE_PROJECT_REF }} || echo "Could not list migrations"
          else
            echo "⚠️  Supabase credentials not fully configured"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Apply all pending migrations
        id: apply-migrations
        run: |
          echo "🔄 Applying migrations..."
          
          if [ -n "${{ env.SUPABASE_PROJECT_REF }}" ] && [ -n "${{ env.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "Using Supabase CLI to push migrations..."
            supabase db push --include-all --project-ref ${{ env.SUPABASE_PROJECT_REF }}
            MIGRATION_RESULT=$?
            
            if [ $MIGRATION_RESULT -eq 0 ]; then
              echo "✅ Migrations applied successfully"
              echo "migration_success=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Migration failed"
              echo "migration_success=false" >> $GITHUB_OUTPUT
              exit $MIGRATION_RESULT
            fi
          elif [ -n "${{ env.DATABASE_URL }}" ]; then
            echo "Using direct database connection..."
            # Apply migrations via psql
            for migration in supabase/migrations/*.sql; do
              if [ -f "$migration" ] && [ "$(basename "$migration")" != "rollback_template.sql" ]; then
                echo "Applying: $migration"
                psql "${{ env.DATABASE_URL }}" -f "$migration" || {
                  echo "⚠️  Migration may have already been applied: $migration"
                }
              fi
            done
            echo "migration_success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No database connection available"
            echo "Please set SUPABASE_PROJECT_REF + SUPABASE_ACCESS_TOKEN or DATABASE_URL"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
          PGPASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}

      - name: Verify migration status
        if: steps.apply-migrations.outputs.migration_success == 'true'
        run: |
          echo "✅ Verifying migration status..."
          if [ -n "${{ env.SUPABASE_PROJECT_REF }}" ] && [ -n "${{ env.SUPABASE_ACCESS_TOKEN }}" ]; then
            supabase migration list --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Comment on issue/PR
        if: github.event_name == 'issue_comment' && steps.apply-migrations.outputs.migration_success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            if (!issueNumber) return;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ **Migrations Applied Successfully**
              
              All pending migrations have been applied to the database.
              
              **Workflow Run:** [View Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              **Completed:** ${new Date().toISOString()}
              `
            });

      - name: Comment on failure
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            if (!issueNumber) return;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `❌ **Migration Failed**
              
              The migration workflow encountered an error. Please check the logs for details.
              
              **Workflow Run:** [View Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              `
            });

      - name: Create summary
        if: always()
        run: |
          echo "## Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations Applied | ${{ steps.apply-migrations.outputs.migration_success }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Completed:** $(date -u)" >> $GITHUB_STEP_SUMMARY
