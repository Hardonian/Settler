name: Reality System Automation

on:
  schedule:
    # Collect metrics every hour
    - cron: "0 * * * *"
    # Weekly loop every Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      job_type:
        description: "Job type to run"
        required: true
        type: choice
        options:
          - collect-metrics
          - weekly-loop
          - both

jobs:
  collect-reality-metrics:
    name: Collect Reality Metrics
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 * * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'collect-metrics' || github.event.inputs.job_type == 'both')

    steps:
      - name: Collect Metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST "${SUPABASE_URL}/functions/v1/collect-reality-metrics" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Metrics collection triggered"

  weekly-reality-loop:
    name: Weekly Reality Loop
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'weekly-loop' || github.event.inputs.job_type == 'both')

    steps:
      - name: Run Weekly Loop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST "${SUPABASE_URL}/functions/v1/weekly-reality-loop" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Weekly loop triggered"
