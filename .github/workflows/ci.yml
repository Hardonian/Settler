name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "vercel.json"
      - "README.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "scripts/**"
      - "prisma/**"
      - "crates/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "vercel.json"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conflict-markers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Detect unresolved conflict markers
        run: pnpm run verify:conflict-markers

      - name: Verify CI resilience contracts
        run: pnpm run verify:ci:workflows

  parity:
    needs: conflict-markers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate || npx prisma generate

      - name: Sync schema to database
        run: npx prisma db push --accept-data-loss

      - name: Doctor
        run: pnpm run doctor -- --fast

      - name: Build web and its workspace deps
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: "production"

      - name: Verify contract and release gates
        run: pnpm run verify:ci:contracts

      - name: Install Helm (packaging verification)
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: Enterprise packaging boundary (SCIM + Helm)
        run: pnpm run verify:scim-posture && pnpm run verify:helm-packaging

  api-tests:
    needs: conflict-markers
    name: api-tests (${{ matrix.shard.index }}/${{ matrix.shard.total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { index: 1, total: 4 }
          - { index: 2, total: 4 }
          - { index: 3, total: 4 }
          - { index: 4, total: 4 }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (produces dist consumed by tests)
        run: pnpm run build

      - name: API tests (isolated shard)
        run: pnpm --filter @settler/api exec jest --runInBand --silent --shard=${{ matrix.shard.index }}/${{ matrix.shard.total }}

  api-tests-serial:
    name: api-tests-serial
    needs: [conflict-markers, api-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "All isolated API test shards passed."

  web-tests-sharded:
    needs: conflict-markers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      SKIP_ENV_VALIDATION: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate || npx prisma generate

      - name: Sync schema to database
        run: npx prisma db push --accept-data-loss

      - name: Build workspace packages (produces dist consumed by web tests)
        run: pnpm run build

      - name: Web tests (sharded with memory cap)
        run: pnpm --filter @settler/web exec jest --maxWorkers=50% --shard=${{ matrix.shard }} --passWithNoTests

  marketing-landing-gates:
    needs: conflict-markers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate || npx prisma generate

      - name: Sync schema to database
        run: npx prisma db push --accept-data-loss

      - name: Build all workspace packages (web build consumes api/reconciliation-core/types/adapters dist)
        run: pnpm run build

      - name: Build web package
        run: pnpm --filter @settler/web build

      - name: Provision Playwright browsers for landing visual gate
        run: npx playwright install --with-deps chromium webkit

      - name: Run marketing landing gates against production server
        run: |
          cd packages/web
          pnpm start &
          SERVER_PID=$!
          echo "Waiting for web server to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start after 30 attempts"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          cd "$GITHUB_WORKSPACE"
          BASE_URL=http://localhost:3000 pnpm run qa:marketing-ctas
          # First run creates missing baselines (--update-snapshots writes actuals)
          BASE_URL=http://localhost:3000 E2E_BASE_URL=http://localhost:3000 pnpm run qa:visual:landing -- --update-snapshots || true
          # Second run verifies against the baselines just created
          BASE_URL=http://localhost:3000 E2E_BASE_URL=http://localhost:3000 pnpm run qa:visual:landing

          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true

  determinism-checks:
    needs: conflict-markers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run determinism check
        run: pnpm run verify:determinism

      - name: Run replay verification
        run: pnpm run verify:replay
