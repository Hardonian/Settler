name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "vercel.json"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "vercel.json"

jobs:
  conflict-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: Detect unresolved conflict markers
        run: pnpm run verify:conflict-markers

  parity:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: Doctor
        run: pnpm run doctor

      - name: Verify
        run: pnpm run verify


  api-tests-serial:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: API tests (serial, force exit)
        run: pnpm --filter @settler/api exec jest --runInBand --forceExit
