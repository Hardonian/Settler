name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "vercel.json"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "vercel.json"

jobs:
  conflict-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: Detect unresolved conflict markers
        run: pnpm run verify:conflict-markers

  parity:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: Doctor
        run: pnpm run doctor

      - name: Verify
        run: pnpm run verify

      - name: Verify surface docs drift gate
        run: pnpm run verify:surface-docs && pnpm run verify:route-classes-doc && pnpm run verify:api-family-docs

  api-tests-serial:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: API tests (serial, force exit)
        run: pnpm run test:ci:verify

  web-tests-sharded:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: Web tests (sharded with memory cap)
        run: pnpm --filter @settler/web exec jest --maxWorkers=50% --shard=${{ matrix.shard }} --passWithNoTests

  marketing-landing-gates:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: Build web package
        run: pnpm --filter @settler/web build

      - name: Provision Playwright browsers for landing visual gate
        run: npx playwright install --with-deps chromium webkit

      - name: Run marketing landing gates against production server
        run: |
          cd packages/web
          pnpm start &
          SERVER_PID=$!
          echo "Waiting for web server to start..."
          sleep 10
          curl -f http://localhost:3000 || (sleep 5 && curl -f http://localhost:3000)

          cd "$GITHUB_WORKSPACE"
          BASE_URL=http://localhost:3000 pnpm run qa:marketing-ctas
          BASE_URL=http://localhost:3000 E2E_BASE_URL=http://localhost:3000 pnpm run qa:visual:landing

          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true

  determinism-checks:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Deterministic install
        run: pnpm run pnpm:ci:install

      - name: Build packages
        run: pnpm run build

      - name: Run determinism check
        run: pnpm run verify:determinism

      - name: Run replay verification
        run: pnpm run verify:replay
