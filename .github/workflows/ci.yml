name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "vercel.json"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "vercel.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true

jobs:
  conflict-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Detect unresolved conflict markers
        run: pnpm run verify:conflict-markers

  pnpm-overrides-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Guard — pnpm overrides must live in pnpm-workspace.yaml, not package.json
        shell: bash
        run: |
          # pnpm v9+ SILENTLY IGNORES `pnpm.overrides` inside package.json.
          # Overrides only take effect from pnpm-workspace.yaml. A package.json
          # overrides block is a silent no-op that leaves CVEs unpatched.
          if python3 -c "import json,sys; d=json.load(open('package.json')); sys.exit(0 if ('pnpm' in d and 'overrides' in d.get('pnpm',{})) or 'overrides' in d else 1)"; then
            echo "::error::package.json contains a 'pnpm.overrides' or top-level 'overrides' block. pnpm v9 ignores package.json overrides — move them to pnpm-workspace.yaml 'overrides:' instead."
            exit 1
          fi
          echo "OK: no package.json overrides block (overrides belong in pnpm-workspace.yaml)."

  parity:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Doctor
        run: pnpm run doctor

      - name: Verify
        run: pnpm run verify

      - name: Verify surface docs drift gate
        run: pnpm run verify:surface-docs && pnpm run verify:route-classes-doc && pnpm run verify:api-family-docs

      - name: Install Helm (packaging verification)
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Enterprise packaging boundary (SCIM + Helm)
        run: pnpm run verify:scim-posture && pnpm run verify:helm-packaging

  api-tests-serial:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: API tests (serial, force exit)
        run: pnpm run test:ci:verify

  web-tests-sharded:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Web tests (sharded with memory cap)
        run: pnpm --filter @settler/web exec jest --maxWorkers=50% --shard=${{ matrix.shard }} --passWithNoTests

  marketing-landing-gates:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Build web package
        run: pnpm --filter @settler/web build

      - name: Provision Playwright browsers for landing visual gate
        run: npx playwright install --with-deps chromium webkit

      - name: Run marketing landing gates against production server
        run: |
          cd packages/web
          pnpm start &
          SERVER_PID=$!
          echo "Waiting for web server to start..."
          sleep 10
          curl -f http://localhost:3000 || (sleep 5 && curl -f http://localhost:3000)

          cd "$GITHUB_WORKSPACE"
          BASE_URL=http://localhost:3000 pnpm run qa:marketing-ctas
          BASE_URL=http://localhost:3000 E2E_BASE_URL=http://localhost:3000 pnpm run qa:visual:landing

          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true

  determinism-checks:
    needs: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-min-32-chars-long-for-testing
      ENCRYPTION_KEY: 12345678901234567890123456789012
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run determinism check
        run: pnpm run verify:determinism

      - name: Run replay verification
        run: pnpm run verify:replay
