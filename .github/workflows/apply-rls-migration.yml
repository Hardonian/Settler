name: Apply RLS Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply migration to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply RLS Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          bash scripts/apply-rls-migration-github-actions.sh

      - name: Verify RLS Status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx tsx scripts/verify-rls-status.ts
