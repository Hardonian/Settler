name: Tenant Safety Contracts

on:
  pull_request:
    paths:
      - "packages/api/src/__tests__/**"
      - "packages/api/src/application/services/JobService.ts"
      - "packages/api/src/application/services/UserService.ts"
      - "packages/api/src/application/webhooks/WebhookIngestionService.ts"
      - "packages/api/src/infrastructure/repositories/*.ts"
      - "packages/api/src/infrastructure/eventsourcing/EventStore.ts"
      - "packages/api/package.json"
      - ".github/workflows/tenant-safety-contracts.yml"
  push:
    branches: [main]
    paths:
      - "packages/api/src/__tests__/**"
      - "packages/api/src/application/services/JobService.ts"
      - "packages/api/src/application/services/UserService.ts"
      - "packages/api/src/application/webhooks/WebhookIngestionService.ts"
      - "packages/api/src/infrastructure/repositories/*.ts"
      - "packages/api/src/infrastructure/eventsourcing/EventStore.ts"
      - "packages/api/package.json"
      - ".github/workflows/tenant-safety-contracts.yml"

jobs:
  tenant-safety-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tenant-safety contract group
        run: pnpm --filter @settler/api test:tenant-safety
