name: Visual Regression & UI Audit

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/web/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/visual-regression.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/web/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Update baseline snapshots (main branch only)"
        type: boolean
        default: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Build the application for testing
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: npx turbo run build --filter @settler/web...
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          SKIP_ENV_VALIDATION: true
          SAFE_MODE: "1"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: packages/web/.next
          retention-days: 1

  # Marketing landing route + visual gates
  landing-quality-gates:
    name: Landing CTA + Visual Gates
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: packages/web/.next

      - name: Gate marketing landing quality post-build
        run: |
          cd packages/web
          pnpm start &
          SERVER_PID=$!
          sleep 10
          curl -f http://localhost:3000 || (sleep 5 && curl -f http://localhost:3000)

          cd "$GITHUB_WORKSPACE"
          BASE_URL=http://localhost:3000 pnpm run qa:marketing-ctas
          BASE_URL=http://localhost:3000 E2E_BASE_URL=http://localhost:3000 pnpm run qa:visual:landing

          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
        env:
          PORT: 3000
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          SAFE_MODE: "1"

      - name: Upload landing gate results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-quality-gates
          path: |
            test-results/
            playwright-report/
            tests/e2e/__snapshots__/
          retention-days: 7

  # Run visual regression tests
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - visual-desktop-light
          - visual-desktop-dark
          - visual-mobile-light
          - visual-tablet
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch all history for proper baseline comparison
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: packages/web/.next

      - name: Start production server
        run: |
          cd packages/web
          npm start &
          sleep 10
          curl -f http://localhost:3000 || (sleep 5 && curl -f http://localhost:3000)
        env:
          PORT: 3000
          NODE_ENV: production
          SAFE_MODE: "1"

      - name: Run visual regression tests
        run: |
          npx playwright test tests/e2e/visual.spec.ts \
            --project=${{ matrix.project }} \
            ${{ github.event.inputs.update_baselines == 'true' && '--update-snapshots' || '' }}
        env:
          BASE_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-results-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload snapshot diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-diffs-${{ matrix.project }}
          path: tests/e2e/__snapshots__/**/*.diff.png
          retention-days: 7

  # UI Consistency Audit
  ui-consistency-audit:
    name: UI Consistency & Functional Integrity Audit
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: packages/web/.next

      - name: Start production server
        run: |
          cd packages/web
          npm start &
          sleep 10
          curl -f http://localhost:3000 || (sleep 5 && curl -f http://localhost:3000)
        env:
          PORT: 3000
          NODE_ENV: production
          SAFE_MODE: "1"

      - name: Run UI Consistency Audit
        run: npx playwright test tests/e2e/ui-consistency.audit.spec.ts --project=ui-audit
        env:
          BASE_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:3000

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Update baselines workflow (manual trigger only, restricted to main)
  update-baselines:
    name: Update Baseline Snapshots
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.update_baselines == 'true' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: packages/web/.next

      - name: Start production server
        run: |
          cd packages/web
          npm start &
          sleep 10
          curl -f http://localhost:3000 || (sleep 5 && curl -f http://localhost:3000)
        env:
          PORT: 3000
          NODE_ENV: production
          SAFE_MODE: "1"

      - name: Update all baseline snapshots
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots
        env:
          BASE_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:3000

      - name: Commit updated baselines
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tests/e2e/__snapshots__/
          git diff --staged --quiet || (git commit -m "chore: update visual regression baselines [skip ci]" && git push)

  # Summary job
  visual-summary:
    name: Visual Tests Summary
    runs-on: ubuntu-latest
    needs: [visual-regression, ui-consistency-audit]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary
        run: |
          echo "## Visual Regression Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each project result
          for project in visual-desktop-light visual-desktop-dark visual-mobile-light visual-tablet; do
            if [ -d "artifacts/visual-results-$project" ]; then
              if [ -f "artifacts/visual-results-$project/test-results/results.json" ]; then
                echo "- ✅ $project: Tests completed" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ⚠️ $project: Results unclear" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "- ❌ $project: No results found" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY

          # Check UI audit
          if [ -d "artifacts/ui-audit-results" ]; then
            echo "- ✅ UI Consistency Audit: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ UI Consistency Audit: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "All test results and screenshots are available as artifacts." >> $GITHUB_STEP_SUMMARY
