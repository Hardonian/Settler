name: Supabase Production Migration

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Apply Migrations (db push)
        run: supabase db push

      - name: Verify RLS Policies
        run: |
          # Simple check to ensure we didn't accidentally disable RLS on key tables
          # This runs against the remote DB via CLI
          supabase db query --command "
            select relname, relrowsecurity 
            from pg_class 
            where relname in ('billing_accounts', 'tenants', 'recon_jobs') 
            and relrowsecurity = false;" \
            | grep "0 rows" || (echo "CRITICAL: RLS disabled on core tables" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Smoke Test
        run: npm run db:smoke
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
