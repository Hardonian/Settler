name: Apply Onboarding Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply migration to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260131000000_workspace_onboarding_activation.sql'
      - 'scripts/apply-onboarding-migration.ts'
      - 'scripts/regenerate-supabase-types.ts'

jobs:
  apply-migration:
    name: Apply Onboarding Migration
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'


      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Onboarding Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔍 Applying onboarding migration..."
          npm run db:migrate:onboarding || {
            echo "⚠️ Migration script failed, trying direct psql..."
            export PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
            psql "${{ secrets.DATABASE_URL }}" -f supabase/migrations/20260131000000_workspace_onboarding_activation.sql
          }

      - name: Verify Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔍 Verifying migration..."
          export PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
          psql "${{ secrets.DATABASE_URL }}" -c "
            SELECT table_name 
            FROM information_schema.tables 
            WHERE table_schema = 'public' 
              AND table_name IN ('workspace_invites', 'tenant_onboarding_progress', 'onboarding_events')
            ORDER BY table_name;
          "

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Regenerate Supabase Types
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "🔄 Regenerating Supabase types..."
          npm run db:types:regenerate || {
            echo "⚠️ Type generation script failed, trying Supabase CLI directly..."
            mkdir -p packages/web/src/types
            supabase gen types typescript --project-id ${{ secrets.SUPABASE_PROJECT_REF }} > packages/web/src/types/database.types.ts
          }

      - name: Verify Types
        run: |
          echo "✅ Verifying TypeScript compilation..."
          npm run typecheck || echo "⚠️ Typecheck failed - review errors above"

      - name: Commit Generated Types
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/web/src/types/database.types.ts
          git diff --staged --quiet || git commit -m "chore: regenerate Supabase types after onboarding migration [skip ci]"
          git push || echo "No changes to commit or push failed"
