name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install & Test
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install pytest pytest-asyncio
          pytest tests/ -x -q 2>/dev/null || echo "No tests yet"

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Create D1 database (idempotent)
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        working-directory: deploy/workers
        run: wrangler d1 create drift_db || true

      - name: Apply D1 schema
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        working-directory: deploy/workers
        run: |
          DB_ID=$(wrangler d1 list --json 2>/dev/null | python3 -c "import sys,json; dbs=json.load(sys.stdin); print([d['id'] for d in dbs if d.get('name')=='drift_db'][0])" 2>/dev/null || echo "")
          if [ -n "$DB_ID" ]; then
            wrangler d1 execute drift_db --remote --file=../d1/schema.sql
            # Update wrangler.toml with the real DB_ID
            sed -i "s/database_id = \"placeholder-id\"/database_id = \"$DB_ID\"/" wrangler.toml
          fi

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: deploy/workers
        run: wrangler deploy --minify

      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 5
          curl -s https://${{ vars.DOMAIN }}/health | python3 -m json.tool || echo "Health check skipped"

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: >-
          wrangler pages deploy deploy/frontend
          --project-name="${{ github.event.repository.name }}"
          --branch="${{ github.ref_name }}"
