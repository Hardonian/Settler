name: Site Mode Matrix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-modes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site_mode: [oss, enterprise]
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYxNTkxOTIwMCwiZXhwIjoxOTMxMjc5MjAwfQ.example"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      - name: Test
        run: pnpm test
      - name: Claims
        run: pnpm verify:claims
        env:
          SITE_MODE: ${{ matrix.site_mode }}
      - name: Boundaries
        run: pnpm verify:boundaries
      - name: Routes
        run: pnpm verify:routes
        env:
          SITE_MODE: ${{ matrix.site_mode }}
          NEXT_PUBLIC_SITE_MODE: ${{ matrix.site_mode }}
