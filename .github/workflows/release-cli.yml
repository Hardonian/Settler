name: Release CLI Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-cli-artifacts:
    name: Build CLI archives (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            ext: tar.gz
          - os: linux
            arch: arm64
            ext: tar.gz
          - os: darwin
            arch: x64
            ext: tar.gz
          - os: darwin
            arch: arm64
            ext: tar.gz
          - os: windows
            arch: x64
            ext: zip
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm --filter @settler/cli build
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="settler-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p out/$NAME
          cp -R packages/cli/dist out/$NAME/dist

          cat > out/$NAME/settler <<'SH'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec node "$DIR/dist/index.js" "$@"
          SH
          chmod +x out/$NAME/settler

          cat > out/$NAME/settler.ps1 <<'PS1'
          $Dir = Split-Path -Parent $MyInvocation.MyCommand.Definition
          node (Join-Path $Dir "dist/index.js") $args
          PS1

          cat > out/$NAME/settler.cmd <<'CMD'
          @echo off
          set DIR=%~dp0
          node "%DIR%dist\index.js" %*
          CMD

          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            (cd out/$NAME && zip -r "../$NAME.zip" .)
            sha256sum "out/$NAME.zip" > "out/$NAME.zip.sha256"
          else
            tar -czf "out/$NAME.tar.gz" -C out/$NAME .
            sha256sum "out/$NAME.tar.gz" > "out/$NAME.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    needs: build-cli-artifacts
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Run smoke (linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="$(find downloaded -name 'settler-*-linux-x64.tar.gz' | head -n1)"
          test -n "$ARTIFACT"
          DIR="$(mktemp -d)"
          tar -xzf "$ARTIFACT" -C "$DIR"
          "$DIR/settler" version
          "$DIR/settler" doctor
      - name: Run smoke (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -Path downloaded -Recurse -Filter "settler-*-windows-x64.zip" | Select-Object -First 1
          if (-not $artifact) { throw "Missing windows artifact" }
          $dir = Join-Path $env:TEMP ("settler-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -Path $dir -ItemType Directory | Out-Null
          Expand-Archive -Path $artifact.FullName -DestinationPath $dir -Force
          & (Join-Path $dir "settler.cmd") version
          & (Join-Path $dir "settler.cmd") doctor

  publish-release-assets:
    name: Publish CLI release assets
    runs-on: ubuntu-latest
    needs: [build-cli-artifacts, install-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten assets
        run: |
          mkdir -p final
          find release-assets -type f \( -name "settler-*" -o -name "*.sha256" \) -exec cp {} final/ \;
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
