name: Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - run: npm ci
      - name: Build application
        run: npx turbo run build
        env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          # Use dummy values for build (smoke tests will use actual deployment URL)
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          SKIP_ENV_VALIDATION: true
      - name: Run smoke tests against deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run qa:smoke
        env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://settler.dev' }}
        continue-on-error: true
      - name: Verify GitHub CLI availability
        if: github.event_name == 'pull_request'
        run: |
          if ! gh --version; then
            echo "GitHub CLI (gh) required for this workflow. Install gh or update the runner image."
            exit 1
          fi

      - name: Get Vercel Preview URL
        if: github.event_name == 'pull_request'
        id: vercel-preview
        run: |
          # Try to get preview URL from Vercel deployment comment
          # This is a best-effort attempt
          PREVIEW_URL=$(gh pr view ${{ github.event.pull_request.number }} --json comments --jq '.comments[] | select(.author.login == "vercel[bot]") | .body' | grep -oP 'https://[^/]+-.*\.vercel\.app' | head -1 || echo "")

          if [ -n "$PREVIEW_URL" ]; then
            echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
            echo "✅ Found Vercel preview URL: $PREVIEW_URL"
          else
            echo "preview_url=" >> $GITHUB_OUTPUT
            echo "⚠️  No Vercel preview URL found (will skip smoke tests)"
          fi
        env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run smoke tests against preview
        if: github.event_name == 'pull_request' && steps.vercel-preview.outputs.preview_url != ''
        run: npm run qa:smoke
        env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          BASE_URL: ${{ steps.vercel-preview.outputs.preview_url }}
        continue-on-error: true

      - name: Skip smoke tests (no preview URL)
        if: github.event_name == 'pull_request' && steps.vercel-preview.outputs.preview_url == ''
        run: |
          echo "⚠️  Smoke tests skipped: No Vercel preview URL available"
          echo "Smoke tests will run after merge to main"
        continue-on-error: true
