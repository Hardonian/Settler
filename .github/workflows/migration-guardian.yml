name: Migration Guardian

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "supabase/migrations/**"
      - "scripts/prisma-migrate-via-supabase-pooler.mjs"
      - "scripts/__tests__/prisma-supabase-pooler.test.mjs"
      - "scripts/supabase-migration-contract.mjs"
      - "scripts/__tests__/supabase-migration-contract.test.mjs"
      - ".github/workflows/migration-guardian.yml"
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "supabase/migrations/**"
      - "scripts/prisma-migrate-via-supabase-pooler.mjs"
      - "scripts/__tests__/prisma-supabase-pooler.test.mjs"
      - "scripts/supabase-migration-contract.mjs"
      - "scripts/__tests__/supabase-migration-contract.test.mjs"
      - ".github/workflows/migration-guardian.yml"

concurrency:
  group: migration-guardian-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Migration Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect and protect migration changes
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            ALL_CHANGES=$(git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA")
            ADDED_CHANGES=$(git diff-tree --root --no-commit-id --name-only --diff-filter=A -r "$HEAD_SHA")
            IMMUTABLE_CANDIDATES=$(git diff-tree --root --no-commit-id --name-only --diff-filter=MDR -r "$HEAD_SHA")
          else
            ALL_CHANGES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            ADDED_CHANGES=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA")
            IMMUTABLE_CANDIDATES=$(git diff --name-only --diff-filter=MDR "$BASE_SHA" "$HEAD_SHA")
          fi

          IMMUTABLE_CHANGES=$(echo "$IMMUTABLE_CANDIDATES" \
            | grep -E '^(prisma/migrations/.+/migration\.sql|supabase/migrations/[^/]+\.sql)$' || true)
          if [ -n "$IMMUTABLE_CHANGES" ]; then
            echo "::error::Migration history is immutable; add a new migration instead"
            echo "$IMMUTABLE_CHANGES"
            exit 1
          fi

          SUPABASE_MIGRATIONS=$(echo "$ADDED_CHANGES" \
            | grep -E '^supabase/migrations/[^/]+\.sql$' \
            | sort || true)
          PRISMA_MIGRATIONS=$(echo "$ADDED_CHANGES" \
            | grep -E '^prisma/migrations/[0-9]{14}_[^/]+/migration\.sql$' \
            | sort || true)
          PRISMA_SCHEMA_CHANGED=$(echo "$ALL_CHANGES" | grep -Fx 'prisma/schema.prisma' || true)

          if [ -n "$PRISMA_SCHEMA_CHANGED" ] && [ -z "$PRISMA_MIGRATIONS" ]; then
            echo "::error file=prisma/schema.prisma::Schema changed without a new Prisma migration"
            exit 1
          fi

          {
            echo "supabase_files<<EOF"
            echo "$SUPABASE_MIGRATIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$SUPABASE_MIGRATIONS" ]; then
            echo "has_supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_supabase=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Test migration contract
        run: >-
          node --test
          scripts/__tests__/prisma-supabase-pooler.test.mjs
          scripts/__tests__/supabase-migration-contract.test.mjs

      - name: Validate new Supabase migrations
        if: steps.changes.outputs.has_supabase == 'true'
        env:
          MIGRATION_FILES: ${{ steps.changes.outputs.supabase_files }}
        run: |
          readarray -t files <<< "$MIGRATION_FILES"
          node scripts/supabase-migration-contract.mjs validate "${files[@]}"
