name: Migration Guardian

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: read
  actions: read

on:
  schedule:
    # Run every hour to check for pending migrations
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger
    inputs:
      environment:
        description: "Environment to migrate"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production
      force:
        description: "Force migration even if checks fail"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "supabase/migrations/**"
      - "scripts/migration-guardian.ts"
  pull_request:
    types: [closed]
    branches:
      - main

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  detect-migrations:
    name: Detect Migration Changes
    runs-on: ubuntu-latest
    outputs:
      has_migrations: ${{ steps.check.outputs.has_migrations }}
      migration_files: ${{ steps.check.outputs.migration_files }}
      migration_type: ${{ steps.check.outputs.migration_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for migration files
        id: check
        run: |
          echo "🔍 Detecting migration changes..."

          # Determine migration type and files
          MIGRATION_TYPE="none"
          MIGRATION_FILES=""

          # Check for Prisma migrations
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PRISMA_MIGRATIONS=$(git diff --name-only $BASE_SHA $HEAD_SHA | grep -E "prisma/migrations/.*\.sql$" || true)
            SCHEMA_CHANGES=$(git diff --name-only $BASE_SHA $HEAD_SHA | grep "prisma/schema.prisma" || true)
          else
            PRISMA_MIGRATIONS=$(git diff --name-only HEAD~1 HEAD | grep -E "prisma/migrations/.*\.sql$" || true)
            SCHEMA_CHANGES=$(git diff --name-only HEAD~1 HEAD | grep "prisma/schema.prisma" || true)
          fi

          # Check for Supabase migrations
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SUPABASE_MIGRATIONS=$(git diff --name-only $BASE_SHA $HEAD_SHA | grep -E "supabase/migrations/.*\.sql$" || true)
          else
            SUPABASE_MIGRATIONS=$(git diff --name-only HEAD~1 HEAD | grep -E "supabase/migrations/.*\.sql$" || true)
          fi

          if [ -n "$PRISMA_MIGRATIONS" ] || [ -n "$SCHEMA_CHANGES" ]; then
            MIGRATION_TYPE="prisma"
            MIGRATION_FILES="$PRISMA_MIGRATIONS"
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "migration_type=prisma" >> $GITHUB_OUTPUT
            echo "migration_files<<EOF" >> $GITHUB_OUTPUT
            echo "$PRISMA_MIGRATIONS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ Found Prisma migrations"
          elif [ -n "$SUPABASE_MIGRATIONS" ]; then
            MIGRATION_TYPE="supabase"
            MIGRATION_FILES="$SUPABASE_MIGRATIONS"
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "migration_type=supabase" >> $GITHUB_OUTPUT
            echo "migration_files<<EOF" >> $GITHUB_OUTPUT
            echo "$SUPABASE_MIGRATIONS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ Found Supabase migrations"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "migration_type=none" >> $GITHUB_OUTPUT
            echo "migration_files=" >> $GITHUB_OUTPUT
            echo "ℹ️  No migration files detected"
          fi

  migration-guardian:
    name: Run Migration Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [detect-migrations]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (needs.detect-migrations.outputs.has_migrations == 'true' && github.event_name == 'push') ||
      (needs.detect-migrations.outputs.has_migrations == 'true' && github.event.pull_request.merged == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies (retry on transient failures)
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && break
            echo "pnpm install failed on attempt $i, retrying..."
            sleep 10
            if [ "$i" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
          done

      - name: Generate Prisma client
        run: pnpm run prisma:generate || pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Migration Guardian
        id: guardian
        run: pnpm run migration:guardian
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          MIGRATION_TYPE: ${{ needs.detect-migrations.outputs.migration_type }}
          MIGRATION_FILES: ${{ needs.detect-migrations.outputs.migration_files }}
          FORCE_MIGRATION: ${{ github.event.inputs.force || 'false' }}
          TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}

      - name: Upload Migration Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log
          path: MIGRATION_LOG.md
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logContent = '';
            try {
              logContent = fs.readFileSync('MIGRATION_LOG.md', 'utf-8');
              const runs = logContent.split('## Run:');
              const latestRun = runs[runs.length - 1];
              const outcomeMatch = latestRun.match(/STATE: (.*?)(?:\n|$)/);
              const outcome = outcomeMatch ? outcomeMatch[1] : 'Unknown';
              
              const body = `## Migration Guardian Results
              
              **Outcome:** \`${outcome}\`
              
              <details>
              <summary>View Migration Log</summary>
              
              \`\`\`
              ${latestRun.substring(0, 2000)}
              \`\`\`
              
              </details>
              
              [View Full Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Could not read migration log:', error.message);
            }

      - name: Create or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logContent = '';
            try {
              logContent = fs.readFileSync('MIGRATION_LOG.md', 'utf-8');
            } catch (error) {
              logContent = 'Migration log not available';
            }

            const body = `## Migration Guardian Failure

            **Workflow Run:** [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Commit:** \`${{ github.sha }}\`
            **Branch:** \`${{ github.ref }}\`

            ### Migration Log
            <details>
            <summary>View Full Log</summary>

            \`\`\`
            ${logContent.substring(0, 10000)}
            \`\`\`

            </details>

            ### Next Steps
            1. Review the migration log above
            2. Check database connectivity
            3. Verify Prisma migrations are valid
            4. Re-run the workflow once issues are resolved
            `;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'migration-failure',
              per_page: 20
            });

            const sameBranchIssue = existing.find(i =>
              i.title.startsWith('🚨 Migration Guardian Failed') &&
              (i.body || '').includes(`**Branch:** \`${{ github.ref }}\``)
            );

            if (sameBranchIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sameBranchIssue.number,
                body: `New failure observed at ${new Date().toISOString()}\n\n${body}`
              });
              core.info(`Updated existing migration failure issue #${sameBranchIssue.number}`);
            } else {
              const title = `🚨 Migration Guardian Failed - ${new Date().toISOString()}`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'migration-failure', 'urgent']
              });
              core.info('Created new migration failure issue');
            }

      - name: Alert on Critical Failure
        if: failure()
        run: |
          echo "🚨 Migration Guardian failed - alerting..."
          # This will be handled by automated-alerting system
          echo "MIGRATION_FAILURE=true" >> $GITHUB_ENV

  apply-staging-migrations:
    name: Apply Migrations to Staging
    runs-on: ubuntu-latest
    needs: [migration-guardian]
    if: |
      success() &&
      (github.event_name == 'push' || github.event.pull_request.merged == true) &&
      needs.detect-migrations.outputs.has_migrations == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - name: Build application
        run: npx turbo run build
      - name: Apply staging migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_ENV: staging
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.STAGING_ENCRYPTION_KEY }}
        run: |
          echo "🔄 Applying migrations to staging..."
          cd packages/api
          npm run migrate:prod
          echo "✅ Staging migrations completed"
      - name: Verify staging health
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          echo "🔍 Verifying staging health..."
          sleep 5
          for i in {1..5}; do
            if curl -f ${STAGING_URL}/health; then
              echo "✅ Staging health check passed"
              exit 0
            fi
            echo "⏳ Retry $i/5..."
            sleep 2
          done
          echo "❌ Staging health check failed after 5 retries"
          exit 1

  apply-production-migrations:
    name: Apply Migrations to Production
    runs-on: ubuntu-latest
    needs: [apply-staging-migrations]
    if: success()
    environment: production # Requires approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - name: Build application
        run: npx turbo run build
      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "🔄 Applying migrations to production..."
          echo "⚠️  PRODUCTION MIGRATION - This will modify the production database"
          cd packages/api
          npm run migrate:prod
          echo "✅ Production migrations completed"
      - name: Verify production health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "🔍 Verifying production health..."
          sleep 10
          for i in {1..10}; do
            if curl -f ${PRODUCTION_URL}/health && curl -f ${PRODUCTION_URL}/health/detailed; then
              echo "✅ Production health check passed"
              exit 0
            fi
            echo "⏳ Retry $i/10..."
            sleep 3
          done
          echo "❌ Production health check failed after 10 retries"
          exit 1
