name: TigerBeetle Cluster Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/api/**"
      - "scripts/**"
      - ".github/workflows/tigerbeetle-cluster.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/api/**"
      - "scripts/**"
      - ".github/workflows/tigerbeetle-cluster.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

env:
  TIGERBEETLE_VERSION: "0.17.9"

jobs:
  tigerbeetle-cluster:
    name: TigerBeetle 3-Node Cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Install TigerBeetle
        run: |
          set -euo pipefail
          TB_VERSION="${TIGERBEETLE_VERSION}"
          case "$(uname -m)" in
            x86_64) TB_ARCH="x86_64" ;;
            aarch64|arm64) TB_ARCH="aarch64" ;;
            *) echo "Unsupported TigerBeetle architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          TB_ASSET="tigerbeetle-${TB_ARCH}-linux.zip"
          curl --fail --location --show-error --silent \
            "https://github.com/tigerbeetle/tigerbeetle/releases/download/${TB_VERSION}/${TB_ASSET}" \
            --output /tmp/tigerbeetle.zip
          unzip -o /tmp/tigerbeetle.zip -d /tmp/tigerbeetle-install
          chmod +x /tmp/tigerbeetle-install/tigerbeetle
          sudo install /tmp/tigerbeetle-install/tigerbeetle /usr/local/bin/tigerbeetle
          tigerbeetle version

      - name: Setup TigerBeetle 3-Node Cluster
        run: |
          set -euo pipefail
          # Create data directories for 3 nodes
          mkdir -p /tmp/tb/{0,1,2}

          # Format each node
          for i in 0 1 2; do
            tigerbeetle format --cluster=0 --replica=$i --replica-count=3 /tmp/tb/$i/tigerbeetle_$i.tigerbeetle
          done

          # Start 3 nodes in background
          for i in 0 1 2; do
            PORT=$((3000 + i))
            tigerbeetle start --addresses=127.0.0.1:3000,127.0.0.1:3001,127.0.0.1:3002 /tmp/tb/$i/tigerbeetle_$i.tigerbeetle > /tmp/tb_$i.log 2>&1 &
            echo $! > /tmp/tb_$i.pid
            echo "Started node $i on port $PORT (PID: $(cat /tmp/tb_$i.pid))"
          done

          # Readiness is proven through the native client protocol.
          for attempt in {1..20}; do
            if timeout 5s pnpm --dir packages/api exec node scripts/tigerbeetle-cluster-smoke.mjs \
              create 999999 127.0.0.1:3000,127.0.0.1:3001,127.0.0.1:3002 \
              >/tmp/tb_ready.log 2>&1; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "TigerBeetle cluster failed to become ready"
              cat /tmp/tb_*.log
              exit 1
            fi
            sleep 1
          done

          for i in 0 1 2; do
            kill -0 "$(cat /tmp/tb_$i.pid)"
          done

          echo "TigerBeetle 3-node cluster ready on ports 3000, 3001, 3002"

      - name: Verify Cluster Consensus
        run: |
          set -euo pipefail
          timeout 10s pnpm --dir packages/api exec node scripts/tigerbeetle-cluster-smoke.mjs \
            create 1000 127.0.0.1:3000,127.0.0.1:3001,127.0.0.1:3002
          timeout 10s pnpm --dir packages/api exec node scripts/tigerbeetle-cluster-smoke.mjs \
            create 1001 127.0.0.1:3000,127.0.0.1:3001,127.0.0.1:3002
          echo "PASS: Cluster committed and read consensus state"

      - name: Test Split-Brain Handling
        run: |
          set -euo pipefail
          # Simulate network partition: stop node 2
          kill $(cat /tmp/tb_2.pid) 2>/dev/null || true
          sleep 2

          # Nodes 0 and 1 should still form quorum (2 of 3).
          timeout 10s pnpm --dir packages/api exec node scripts/tigerbeetle-cluster-smoke.mjs \
            create 2000 127.0.0.1:3000,127.0.0.1:3001

          # Restart node 2
          PORT=3002
          tigerbeetle start --addresses=127.0.0.1:3000,127.0.0.1:3001,127.0.0.1:3002 /tmp/tb/2/tigerbeetle_2.tigerbeetle > /tmp/tb_2.log 2>&1 &
          echo $! > /tmp/tb_2.pid
          # Verify node 2 catches up by reading the write committed while it was offline.
          for attempt in {1..20}; do
            if timeout 5s pnpm --dir packages/api exec node scripts/tigerbeetle-cluster-smoke.mjs \
              lookup 2000 127.0.0.1:3002 >/tmp/accounts_recovered.log 2>&1; then
              echo "Node 2 recovered and caught up"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Node 2 failed to recover"
              cat /tmp/tb_2.log
              exit 1
            fi
            sleep 1
          done

          echo "PASS: Cluster retained quorum and the restarted replica caught up"

      - name: Test Replication Factor
        run: |
          set -euo pipefail
          # A client bootstrapped from each replica must observe the quorum write.
          for i in 0 1 2; do
            PORT=$((3000 + i))
            timeout 10s pnpm --dir packages/api exec node scripts/tigerbeetle-cluster-smoke.mjs \
              lookup 2000 "127.0.0.1:$PORT"
          done
          echo "PASS: Replicated state is visible through every replica"

      - name: Run Settler API Tests Against TB Cluster
        run: |
          set -euo pipefail
          export TIGERBEETLE_ENABLED="true"
          export TIGERBEETLE_ADDRESS="127.0.0.1:3000"
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/settler_test"
          export REDIS_URL="redis://localhost:6379"
          export JWT_SECRET="test-secret-min-32-chars-long-for-testing"
          export ENCRYPTION_KEY="12345678901234567890123456789012"
          pnpm --filter @settler/api run test:tb

      - name: Cleanup
        if: always()
        run: |
          # Kill TigerBeetle processes
          for pid_file in /tmp/tb_*.pid; do
            if [ -f "$pid_file" ]; then
              kill $(cat "$pid_file") 2>/dev/null || true
            fi
          done
          # Clean up temp files
          rm -rf /tmp/tb /tmp/tb_*.log /tmp/tb_*.pid /tmp/accounts_*.json /tmp/create_accounts_*.json /tmp/new_account.json
