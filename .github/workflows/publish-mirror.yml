name: Publish Mirror

on:
  push:
    tags:
      - "v*.*.*" # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish"
        required: true
        type: string

jobs:
  publish-mirror:
    name: Publish to Public Mirror
    runs-on: ubuntu-latest
    # Only run if mirror publishing is enabled
    if: ${{ vars.ENABLE_MIRROR_PUBLISHING != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"


      - run: pnpm install --frozen-lockfile

      - name: Run classification
        run: pnpm run classify:strict

      - name: Run mirror dry-run
        run: pnpm run mirror:dryrun

      - name: Verify mirror export
        run: pnpm run mirror:verify

      - name: Setup Git for mirror
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Initialize mirror repository
        run: |
          cd .mirror-out
          git init
          git remote add public ${{ secrets.PUBLIC_MIRROR_REPO_URL }} || true
          git fetch public || true

      - name: Commit mirror export
        run: |
          cd .mirror-out
          git add .
          git commit -m "chore: sync OSS mirror (tag: ${{ steps.tag.outputs.tag }})" || echo "No changes to commit"

      - name: Push to public mirror
        run: |
          cd .mirror-out
          git tag ${{ steps.tag.outputs.tag }} || true
          git push public main --force || git push public main
          git push public ${{ steps.tag.outputs.tag }} || true
        env:
          GIT_ASKPASS: echo
          GIT_USERNAME: ${{ secrets.PUBLIC_MIRROR_GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.PUBLIC_MIRROR_GIT_TOKEN }}
