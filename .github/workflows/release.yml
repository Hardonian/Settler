name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  validate-version:
    name: Validate Semver
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Get current version
        id: current
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Validate semantic version
        run: node scripts/enforce-semver.js ${{ steps.current.outputs.version }} ${{ github.event.inputs.version }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate-version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run doctor
        run: npm run doctor

      - name: Run tests
        run: npm test

      - name: Verify content routes in production mode
        run: npm run test --workspace=packages/web -- src/__tests__/integration/content-pages.production.test.ts

      - name: Run build
        run: npx turbo run build

      - name: Generate conventional changelog
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE=${PREVIOUS_TAG:+$PREVIOUS_TAG..}$TAG

          # Categorize commits
          BREAKING=$(git log $RANGE --pretty=format:"%s" | grep -E "^[a-z]+!: |BREAKING CHANGE:" || true)
          FEATURES=$(git log $RANGE --pretty=format:"%s" | grep -E "^feat(\([^)]+\))?: " || true)
          FIXES=$(git log $RANGE --pretty=format:"%s" | grep -E "^fix(\([^)]+\))?: " || true)

          # Build changelog
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT

          if [ -n "$BREAKING" ]; then
            echo "### ⚠️ Breaking Changes" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$BREAKING" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          if [ -n "$FEATURES" ]; then
            echo "### ✨ New Features" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$FEATURES" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$FIXES" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          echo "### Verification" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "- ✅ All tests passed" >> $GITHUB_OUTPUT
          echo "- ✅ Build successful" >> $GITHUB_OUTPUT
          echo "- ✅ Doctor checks passed" >> $GITHUB_OUTPUT
          echo "- ✅ Semantic versioning validated" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.ref_name }}
          path: |
            packages/web/.next
            packages/api/dist
            packages/sdk/dist
            packages/cli/dist
          retention-days: 30

  version-bump:
    name: Bump Version
    runs-on: ubuntu-latest
    needs: validate-version
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          VERSION=${{ github.event.inputs.version }}
          npm version $VERSION --no-git-tag-version

      - name: Commit and tag
        run: |
          git add package.json
          git commit -m "chore(release): bump version to ${{ github.event.inputs.version }}"
          git tag v${{ github.event.inputs.version }}
          git push origin main
          git push origin v${{ github.event.inputs.version }}
