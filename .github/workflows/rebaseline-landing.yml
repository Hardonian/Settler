name: Rebaseline Landing Visuals
# Generates tests/e2e/__snapshots__ baselines on the SAME runner image and
# environment as the marketing-landing-gates CI job, then commits them to the
# requested branch. Use after intentional landing-page redesigns, or when the
# baseline directory is missing. Review the diff before merging — this is the
# mechanism the gate's "baselines are reviewed and committed with the change"
# comment expects to exist.
#
# Trust note: workflow_dispatch requires write repository access, so
# inputs.branch comes from trusted maintainers. It is still passed through an
# env var (never interpolated directly into a run script) per GH Actions
# injection guidance. Postgres credentials below are the throwaway CI-service
# pair used identically by the gate job they mirror (GH expressions so tooling
# redaction does not mangle the literal values).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to generate and commit baselines on"
        required: true
        default: "main"

permissions:
  contents: write

concurrency:
  group: rebaseline-landing
  cancel-in-progress: false

jobs:
  rebaseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ 'postgres' }}
          POSTGRES_DB: settler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ANON_KEY: dummy-anon-key
      SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET: test-secret-…ling
      ENCRYPTION_KEY: ${{ '12345678901234567890123456789012' }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settler_test
      REDIS_URL: redis://localhost:6379
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate || npx prisma generate

      - name: Sync schema to database
        run: npx prisma db push --accept-data-loss

      - name: Build all workspace packages
        run: pnpm run build

      - name: Build web package
        run: pnpm --filter @settler/web build

      - name: Provision Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Generate baselines against production server
        run: |
          set -Eeuo pipefail
          cd packages/web
          pnpm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 30 ]; then
              kill $SERVER_PID 2>/dev/null || true
              echo "Server failed to start"
              exit 1
            fi
            sleep 2
          done
          cd "$GITHUB_WORKSPACE"
          CI_VISUAL_LANDING=1 BASE_URL=http://localhost:3000 E2E_BASE_URL=http://localhost:3000 \
            npx playwright test tests/e2e/landing-home.visual.spec.ts \
              --project=visual-desktop-light --project=visual-mobile-light --update-snapshots
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true

      - name: Commit and push baselines
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain tests/e2e/__snapshots__)" ]; then
            echo "No baseline changes detected (already committed) — nothing to push."
            exit 0
          fi
          git add tests/e2e/__snapshots__
          git commit -m "test(e2e): rebaseline landing visuals via CI-matched runner" \
            -m "Generated by Rebaseline Landing Visuals workflow on ubuntu-24.04 with the same env as marketing-landing-gates."
          git push origin "HEAD:${TARGET_BRANCH}"
