name: Internal Doc Hygiene Guard

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  internal-guard:
    name: Check Internal Files Not Tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check internal/ directory not tracked
        run: |
          echo "🔍 Checking for internal files in git tracking..."

          # Check if any internal/ files are tracked
          INTERNAL_TRACKED=$(git ls-files internal/ 2>/dev/null || true)
          if [[ -n "$INTERNAL_TRACKED" ]]; then
              echo "❌ ERROR: Found tracked files in internal/ directory:"
              echo "$INTERNAL_TRACKED"
              echo ""
              echo "Internal files should not be tracked in git."
              exit 1
          fi

          # Check for completion reports in root
          ROOT_COMPLETION=$(git ls-files | grep -E "^(COMPLETE_|FINAL_|GO_LIVE)" || true)
          if [[ -n "$ROOT_COMPLETION" ]]; then
              echo "❌ ERROR: Found completion reports in root that should be in internal/:"
              echo "$ROOT_COMPLETION"
              exit 1
          fi

          # Check for agent docs in root
          AGENT_DOCS=$(git ls-files | grep -E "^(AGENTS\.md|CLAUDE\.md)" || true)
          if [[ -n "$AGENT_DOCS" ]]; then
              echo "❌ ERROR: Found agent docs in root:"
              echo "$AGENT_DOCS"
              exit 1
          fi

          # Check for .claude directory
          CLAUDE_TRACKED=$(git ls-files .claude/ 2>/dev/null || true)
          if [[ -n "$CLAUDE_TRACKED" ]]; then
              echo "❌ ERROR: Found tracked files in .claude/ directory:"
              echo "$CLAUDE_TRACKED"
              exit 1
          fi

          echo "✅ No internal files found in git tracking."
          echo "✅ CI guard passed."

      - name: Check new files don't match internal patterns
        run: |
          echo "🔍 Checking for new files matching internal patterns..."

          # Get list of added files in this PR/push
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              NEW_FILES=$(git diff --name-status origin/${{ github.base_ref }}...HEAD | grep "^A" | awk '{print $2}' || true)
          else
              NEW_FILES=$(git diff --name-status HEAD~1..HEAD | grep "^A" | awk '{print $2}' || true)
          fi

          # Check for problematic patterns
          VIOLATIONS=""

          while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              # Check for internal/ paths
              if [[ "$file" == internal/* ]]; then
                  VIOLATIONS="${VIOLATIONS}\n  - $file (internal/)"
              fi

              # Check for completion report patterns
              if [[ "$file" =~ ^COMPLETE_.*\.md$ ]] || [[ "$file" =~ ^FINAL_.*\.md$ ]] || [[ "$file" =~ ^GO_LIVE.*\.md$ ]]; then
                  VIOLATIONS="${VIOLATIONS}\n  - $file (completion report in root)"
              fi

              # Check for agent docs
              if [[ "$file" == "AGENTS.md" ]] || [[ "$file" == "CLAUDE.md" ]]; then
                  VIOLATIONS="${VIOLATIONS}\n  - $file (agent doc in root)"
              fi

              # Check for .claude/
              if [[ "$file" == .claude/* ]]; then
                  VIOLATIONS="${VIOLATIONS}\n  - $file (.claude/)"
              fi
          done <<< "$NEW_FILES"

          if [[ -n "$VIOLATIONS" ]]; then
              echo "❌ ERROR: New files violate internal doc hygiene rules:"
              echo -e "$VIOLATIONS"
              echo ""
              echo "Move these files to internal/ or update .gitignore patterns."
              exit 1
          fi

          echo "✅ No new internal pattern violations found."
