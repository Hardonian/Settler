name: Apply Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**/*.sql'
      - '.github/workflows/apply-migrations.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**/*.sql'
      - '.github/workflows/apply-migrations.yml'
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '24'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  apply-migrations:
    name: Apply Migrations
    runs-on: ubuntu-latest
    
    # Only run on main branch merges or if explicitly triggered
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event.pull_request.base.ref == 'main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Error: DATABASE_URL secret is not set"
            echo "Please add DATABASE_URL to GitHub repository secrets"
            exit 1
          fi
          echo "✅ DATABASE_URL is set (hidden for security)"

      - name: Apply migrations
        id: migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔌 Connecting to database via pooler..."
          npm run db:migrate:pooler
        continue-on-error: false

      - name: Verify migrations
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "✅ Verifying migrations were applied..."
          npx tsx -e "
            import { Client } from 'pg';
            const client = new Client({ 
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false }
            });
            await client.connect();
            const result = await client.query(
              'SELECT version, name, inserted_at FROM supabase_migrations.schema_migrations ORDER BY inserted_at DESC'
            );
            console.log('📊 Applied migrations:');
            result.rows.forEach(row => {
              console.log(\`  ✅ \${row.version} - \${row.name}\`);
            });
            await client.end();
          "

      - name: Comment on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Database migrations applied successfully!'
            })

      - name: Comment on PR (failure)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Database migrations failed. Please check the workflow logs.'
            })

      - name: Create deployment summary
        if: always()
        run: |
          echo "## Migration Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Status**: Migrations applied successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status**: Migration failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
