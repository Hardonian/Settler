<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Customize PDF Summary Report - Settler</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header -->
<header class="flex items-center bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 sticky top-0 z-10">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">arrow_back</span>
</button>
<h1 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 ml-2">Customize Report Summary</h1>
<button class="text-primary text-base font-bold leading-normal px-2 hover:opacity-80 transition-opacity">Save</button>
</header>
<main class="flex-1 overflow-y-auto pb-32">
<!-- Section: Report Content -->
<div class="px-4 pt-6">
<h2 class="text-slate-900 dark:text-white text-sm font-bold uppercase tracking-wider mb-2">Report Content</h2>
<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800 overflow-hidden">
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
<span class="text-slate-700 dark:text-slate-200 text-base font-medium">Executive Summary</span>
<input checked="" class="h-6 w-6 rounded border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
<span class="text-slate-700 dark:text-slate-200 text-base font-medium">High-Level Metrics (Match Rate, Variance)</span>
<input checked="" class="h-6 w-6 rounded border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
<span class="text-slate-700 dark:text-slate-200 text-base font-medium">Exception Aging Waterfall</span>
<input checked="" class="h-6 w-6 rounded border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
<span class="text-slate-700 dark:text-slate-200 text-base font-medium">Connector Health Status</span>
<input class="h-6 w-6 rounded border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
<span class="text-slate-700 dark:text-slate-200 text-base font-medium">Audit Trail Summary (last 50 events)</span>
<input class="h-6 w-6 rounded border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</label>
</div>
</div>
<!-- Section: Detail Level -->
<div class="px-4 pt-8">
<h2 class="text-slate-900 dark:text-white text-sm font-bold uppercase tracking-wider mb-3">Detail Level</h2>
<div class="flex bg-slate-200/50 dark:bg-slate-800/50 p-1 rounded-xl">
<label class="flex-1">
<input checked="" class="hidden peer" name="detail_level" type="radio" value="compact"/>
<div class="flex items-center justify-center py-2.5 rounded-lg text-sm font-semibold text-slate-500 dark:text-slate-400 peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-slate-900 dark:peer-checked:text-white peer-checked:shadow-sm transition-all cursor-pointer">
                            Compact
                        </div>
</label>
<label class="flex-1">
<input class="hidden peer" name="detail_level" type="radio" value="detailed"/>
<div class="flex items-center justify-center py-2.5 rounded-lg text-sm font-semibold text-slate-500 dark:text-slate-400 peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-slate-900 dark:peer-checked:text-white peer-checked:shadow-sm transition-all cursor-pointer">
                            Detailed
                        </div>
</label>
</div>
<p class="mt-2 text-xs text-slate-500 dark:text-slate-400 px-1">
                    Compact shows totals only. Detailed includes itemized lists for exceptions and variances.
                </p>
</div>
<!-- Section: Branding -->
<div class="px-4 pt-8">
<h2 class="text-slate-900 dark:text-white text-sm font-bold uppercase tracking-wider mb-2">Branding</h2>
<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">business</span>
<span class="text-slate-700 dark:text-slate-200 text-base font-medium">Include Company Logo</span>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</div>
</div>
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">gavel</span>
<span class="text-slate-700 dark:text-slate-200 text-base font-medium">Include Footer Disclaimer</span>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</div>
</div>
</div>
</div>
<!-- Preview Button -->
<div class="px-4 pt-8 pb-4">
<button class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl border-2 border-primary/20 bg-primary/5 text-primary font-bold hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility</span>
                    Preview Sample PDF
                </button>
</div>
</main>
<!-- Fixed Footer Actions -->
<footer class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 p-4 pb-8">
<button class="w-full bg-primary text-white py-4 rounded-xl font-bold text-base shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-[0.98] transition-all">
                Generate Report
            </button>
</footer>
</div>
</body></html>
