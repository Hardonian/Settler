<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Hardonia private EPYC GPU inference fabric</title>
  <desc id="desc">A private, local-first AI stack: HX370 command center routes work to an EPYC GPU server equipped with Tesla V100, P40 and RTX 3060 GPUs, delivering routed Ollama, ComfyUI and batch inference services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b1b"/><stop offset=".5" stop-color="#11153c"/><stop offset="1" stop-color="#071f2a"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset=".48" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8b9cce" stroke-opacity=".11"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="22" fill="url(#grid)"/>
  <circle cx="1030" cy="-35" r="280" fill="#2563eb" opacity=".15"/><circle cx="210" cy="500" r="230" fill="#7c3aed" opacity=".13"/>
  <rect x="28" y="27" width="1144" height="405" rx="17" fill="#071225" fill-opacity=".54" stroke="#7182b7" stroke-opacity=".34"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="66" cy="67" r="7" fill="#34d399" filter="url(#glow)"/><text x="84" y="72" fill="#cbd5e1" font-size="15" letter-spacing="2.2">HARDONIA PRIVATE AI FABRIC</text>
    <text x="66" y="122" fill="#f8fafc" font-size="34" font-weight="700">EPYC GPU STACK</text>
    <text x="66" y="151" fill="#9fb0d6" font-size="15">LOCAL-FIRST INFERENCE • NO DATA EGRESS • WORKLOAD-ROUTED</text>

    <path d="M282 255 H382 M818 255 H918" stroke="url(#edge)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="333" cy="255" r="5" fill="#22d3ee"/><circle cx="867" cy="255" r="5" fill="#a78bfa"/>

    <g transform="translate(65 195)">
      <rect width="217" height="122" rx="14" fill="#0a2434" stroke="#22d3ee" stroke-opacity=".82" stroke-width="1.5"/>
      <rect x="18" y="19" width="40" height="40" rx="9" fill="#083b52" stroke="#22d3ee"/>
      <path d="M29 39h18M38 30v18" stroke="#67e8f9" stroke-width="2"/><text x="73" y="38" fill="#e0f2fe" font-size="15" font-weight="700">COMMAND CENTER</text>
      <text x="73" y="60" fill="#78d9ed" font-size="11">HX370 WSL</text><text x="18" y="89" fill="#c6d5ea" font-size="12">Hermes orchestration</text><text x="18" y="108" fill="#8196bb" font-size="11">Repo repair · browser ops</text>
    </g>

    <g transform="translate(382 174)">
      <rect width="436" height="163" rx="17" fill="#16134a" fill-opacity=".82" stroke="url(#core)" stroke-width="2" filter="url(#glow)"/>
      <rect x="20" y="20" width="396" height="35" rx="8" fill="#20215c"/><circle cx="40" cy="37" r="7" fill="#a78bfa"/><text x="57" y="42" fill="#f5f3ff" font-size="16" font-weight="700">EPYC GPU COMPUTE CORE</text>
      <g transform="translate(21 74)">
        <rect width="116" height="57" rx="9" fill="#172d67" stroke="#4f8dff"/><text x="16" y="24" fill="#dbeafe" font-size="14" font-weight="700">TESLA V100</text><text x="16" y="43" fill="#93c5fd" font-size="10">inference lane</text>
        <rect x="139" width="116" height="57" rx="9" fill="#172d67" stroke="#4f8dff"/><text x="157" y="24" fill="#dbeafe" font-size="14" font-weight="700">TESLA P40</text><text x="157" y="43" fill="#93c5fd" font-size="10">capacity lane</text>
        <rect x="278" width="137" height="57" rx="9" fill="#172d67" stroke="#4f8dff"/><text x="296" y="24" fill="#dbeafe" font-size="14" font-weight="700">RTX 3060</text><text x="296" y="43" fill="#93c5fd" font-size="10">creative lane</text>
      </g>
    </g>

    <g transform="translate(918 195)">
      <rect width="217" height="122" rx="14" fill="#14283a" stroke="#a78bfa" stroke-opacity=".82" stroke-width="1.5"/>
      <rect x="18" y="19" width="40" height="40" rx="9" fill="#30205b" stroke="#a78bfa"/><path d="M30 32h17v14H30zM34 28v4m9-4v4M34 46v4m9-4v4" fill="none" stroke="#c4b5fd" stroke-width="2"/>
      <text x="73" y="38" fill="#ede9fe" font-size="15" font-weight="700">PRODUCT SURFACES</text><text x="73" y="60" fill="#c4b5fd" font-size="11">LOCAL DELIVERY</text><text x="18" y="89" fill="#c6d5ea" font-size="12">Ollama · ComfyUI · APIs</text><text x="18" y="108" fill="#8196bb" font-size="11">apps · batch jobs · assets</text>
    </g>

    <path d="M92 369h1016" stroke="#7182b7" stroke-opacity=".28"/>
    <text x="66" y="403" fill="#89a0c7" font-size="12" letter-spacing="1.25">PRIVATE BY DESIGN</text><circle cx="251" cy="399" r="3" fill="#34d399"/><text x="269" y="403" fill="#89a0c7" font-size="12" letter-spacing="1.25">AUDITABLE OPERATIONS</text><circle cx="519" cy="399" r="3" fill="#34d399"/><text x="537" y="403" fill="#89a0c7" font-size="12" letter-spacing="1.25">ROUTED BY WORKLOAD</text>
    <text x="1092" y="403" text-anchor="end" fill="#64748b" font-size="11">EPYC / GPU LAB</text>
  </g>
</svg>
