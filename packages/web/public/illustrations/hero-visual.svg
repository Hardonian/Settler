<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glow-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.05" />
        </linearGradient>
        <linearGradient id="glow-cyan" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
        </linearGradient>
        <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="40" />
        </filter>
    </defs>

    <!-- Animated-style background blobs -->
    <circle cx="200" cy="200" r="150" fill="url(#glow-indigo)" filter="url(#blur-bg)" />
    <circle cx="1000" cy="600" r="200" fill="url(#glow-cyan)" filter="url(#blur-bg)" />
    <circle cx="600" cy="400" r="250" fill="url(#glow-indigo)" fill-opacity="0.1"
        filter="url(#blur-bg)" />

    <!-- Central Engine Visualization -->
    <g transform="translate(600, 400)">
        <!-- Outer Rings -->
        <circle r="220" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="8 12" opacity="0.5" />
        <circle r="180" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 6" />

        <!-- Core -->
        <rect x="-100" y="-120" width="200" height="240" rx="32" fill="white"
            filter="drop-shadow(0px 20px 40px rgba(0,0,0,0.08))" />
        <rect x="-80" y="-100" width="160" height="200" rx="24" fill="#F8FAFC" />

        <!-- Interface elements -->
        <rect x="-60" y="-70" width="120" height="12" rx="6" fill="#E2E8F0" />
        <rect x="-60" y="-40" width="80" height="12" rx="6" fill="#E2E8F0" />
        <rect x="-60" y="-10" width="100" height="12" rx="6" fill="#E2E8F0" />

        <rect x="-60" y="40" width="120" height="60" rx="12" fill="#4F46E5" fill-opacity="0.1"
            stroke="#4F46E5" stroke-width="1" />
        <text x="0" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="12"
            font-weight="700" fill="#4F46E5">RECONCILE</text>
    </g>

    <!-- Floating Data Nodes -->
    <g opacity="0.8">
        <!-- Node Left (Stripe) -->
        <g transform="translate(200, 300)">
            <rect width="160" height="48" rx="12" fill="white"
                filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))" />
            <circle cx="24" cy="24" r="8" fill="#6366F1" />
            <text x="44" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600"
                fill="#1E293B">Stripe API</text>
            <path d="M160 24 C 250 24, 300 100, 400 100" stroke="#CBD5E1" stroke-width="2"
                fill="none" stroke-dasharray="4 4" />
        </g>

        <!-- Node Left (Banking) -->
        <g transform="translate(180, 500)">
            <rect width="180" height="48" rx="12" fill="white"
                filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))" />
            <circle cx="24" cy="24" r="8" fill="#10B981" />
            <text x="44" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600"
                fill="#1E293B">Plaid / Banking</text>
            <path d="M180 24 C 280 24, 320 -50, 420 -50" stroke="#CBD5E1" stroke-width="2"
                fill="none" stroke-dasharray="4 4" />
        </g>

        <!-- Node Right (Internal) -->
        <g transform="translate(840, 350)">
            <rect width="180" height="48" rx="12" fill="white"
                filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))" />
            <circle cx="24" cy="24" r="8" fill="#F43F5E" />
            <text x="44" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600"
                fill="#1E293B">Internal Database</text>
            <path d="M0 24 C -100 24, -150 50, -240 50" stroke="#CBD5E1" stroke-width="2"
                fill="none" stroke-dasharray="4 4" />
        </g>
    </g>

</svg>
