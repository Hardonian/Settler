<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glows -->
  <circle cx="150" cy="180" r="140" fill="#3B82F6" fill-opacity="0.12" filter="url(#softGlow)" />
  <circle cx="450" cy="320" r="160" fill="#06B6D4" fill-opacity="0.1" filter="url(#softGlow)" />
  <circle cx="300" cy="250" r="100" fill="#10B981" fill-opacity="0.08" filter="url(#softGlow)" />

  <!-- Main Chassis / Terminal Card -->
  <rect x="24" y="20" width="552" height="460" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Window Header Bar -->
  <rect x="24" y="20" width="552" height="44" rx="16" fill="#1E293B" fill-opacity="0.7" />
  <circle cx="50" cy="42" r="5" fill="#EF4444" />
  <circle cx="66" cy="42" r="5" fill="#F59E0B" />
  <circle cx="82" cy="42" r="5" fill="#10B981" />
  <text x="300" y="46" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">settler-kernel :: continuous-reconciliation-v2.8 [LIVE]</text>
  <line x1="24" y1="64" x2="576" y2="64" stroke="#334155" stroke-width="1" />

  <!-- Left: Ingestion Feed (Source Side) -->
  <g transform="translate(48, 88)">
    <rect width="140" height="64" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="24" cy="28" r="8" fill="#3B82F6" fill-opacity="0.2" />
    <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#60A5FA">S</text>
    <text x="42" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Stripe Feed</text>
    <text x="42" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">12,450 tx/sec • 2PC</text>
    <rect x="108" y="14" width="22" height="12" rx="6" fill="#10B981" fill-opacity="0.2" />
    <text x="119" y="23" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#34D399">T+0</text>
  </g>

  <g transform="translate(48, 168)">
    <rect width="140" height="64" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="28" r="8" fill="#6366F1" fill-opacity="0.2" />
    <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#818CF8">N</text>
    <text x="42" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">NetSuite ERP</text>
    <text x="42" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">GL Journal Sync</text>
  </g>

  <g transform="translate(48, 248)">
    <rect width="140" height="64" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="28" r="8" fill="#0EA5E9" fill-opacity="0.2" />
    <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38BDF8">FED</text>
    <text x="42" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">FedNow ISO</text>
    <text x="42" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">camt.053 settlement</text>
  </g>

  <!-- Connectors from Feeds to Core Engine -->
  <path d="M188 120 C 215 120, 215 195, 240 195" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="214" cy="158" r="3" fill="#60A5FA" />
  <path d="M188 200 H 240" stroke="#818CF8" stroke-width="2" />
  <path d="M188 280 C 215 280, 215 205, 240 205" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Center Core: Settler Deterministic Kernel + TigerBeetle -->
  <g transform="translate(240, 130)">
    <rect width="144" height="150" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2" filter="url(#dropShadow)" />
    <!-- Glowing core header -->
    <rect x="0" y="0" width="144" height="32" rx="14" fill="url(#blueGlow)" fill-opacity="0.2" />
    <text x="72" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">SETTLER KERNEL</text>
    <line x1="0" y1="32" x2="144" y2="32" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4" />

    <!-- Center Atom / Hexagon -->
    <polygon points="72,50 96,64 96,92 72,106 48,92 48,64" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
    <circle cx="72" cy="78" r="8" fill="url(#blueGlow)" />
    <circle cx="72" cy="78" r="14" stroke="#34D399" stroke-width="1" stroke-dasharray="2 2" />

    <text x="72" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F1F5F9">Exact Cent Math</text>
    <text x="72" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">0% Float Drift</text>
  </g>

  <!-- Connectors from Engine to Proof & Ledger -->
  <path d="M384 195 C 410 195, 410 135, 436 135" stroke="#10B981" stroke-width="2" />
  <path d="M384 205 C 410 205, 410 265, 436 265" stroke="#06B6D4" stroke-width="2" />

  <!-- Right Top: RFC 6962 Merkle Proofpack -->
  <g transform="translate(436, 100)">
    <rect width="116" height="80" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <path d="M16 20 L 26 12 L 36 20 L 26 28 Z" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
    <text x="44" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">Proofpack</text>
    <text x="14" y="44" font-family="monospace" font-size="9" fill="#94A3B8">sha256: 7f83b...</text>
    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#CBD5E1">WASM verified</text>
    <circle cx="98" cy="20" r="4" fill="#10B981" />
  </g>

  <!-- Right Bottom: TigerBeetle Immutable Ledger -->
  <g transform="translate(436, 225)">
    <rect width="116" height="80" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" />
    <rect x="14" y="14" width="16" height="14" rx="3" fill="#0EA5E9" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">TigerBeetle</text>
    <text x="14" y="46" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Sub-ms 2PC Post</text>
    <text x="14" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#CBD5E1">Zero Fee Leakage</text>
    <circle cx="98" cy="22" r="4" fill="#0EA5E9" />
  </g>

  <!-- Bottom Metric & Status Dock -->
  <g transform="translate(48, 336)">
    <rect width="504" height="114" rx="12" fill="#090E17" stroke="#334155" stroke-width="1" />

    <!-- Stat 1 -->
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.5">MATCHED VOLUME</text>
    <text x="24" y="58" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">$48,291,040.00</text>
    <text x="24" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#34D399">↑ 100.00% Zero-Variance</text>

    <!-- Divider -->
    <line x1="184" y1="20" x2="184" y2="94" stroke="#1E293B" stroke-width="1.5" />

    <!-- Stat 2 -->
    <text x="204" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.5">CLOSE CYCLE TIME</text>
    <text x="204" y="58" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#38BDF8">4.2 ms / tx</text>
    <text x="204" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Continuous T+0 Close</text>

    <!-- Divider -->
    <line x1="344" y1="20" x2="344" y2="94" stroke="#1E293B" stroke-width="1.5" />

    <!-- Stat 3 -->
    <text x="364" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.5">LEAKAGE RECOVERED</text>
    <text x="364" y="58" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#A7F3D0">$142,850.12</text>
    <text x="364" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#60A5FA">Stripe/PayPal Tier Creep</text>
  </g>
</svg>
