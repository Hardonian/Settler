    <text x="50" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A">Processor Fee Anomaly Detected</text>
    <text x="50" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Stripe interchange +42 bps over contract tier ($1,840 variance)</text>
    <rect x="50" y="52" width="110" height="16" rx="4" fill="#F59E0B" fill-opacity="0.15" />
    <text x="56" y="63" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#FBBF24">CONFIDENCE: 99.4%</text>
