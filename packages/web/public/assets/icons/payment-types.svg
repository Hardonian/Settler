<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="achGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wireGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Credit/Debit Cards -->
  <g id="cards">
    <rect x="20" y="20" width="160" height="80" rx="8" fill="url(#cardGradient)" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
    <rect x="30" y="30" width="140" height="50" rx="4" fill="white"/>
    <rect x="30" y="30" width="140" height="20" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Credit/Debit Cards</text>
    <text x="100" y="115" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Visa, Mastercard, Amex</text>
  </g>
  
  <!-- ACH -->
  <g id="ach">
    <rect x="220" y="20" width="160" height="80" rx="8" fill="url(#achGradient)" opacity="0.1" stroke="#10b981" stroke-width="2"/>
    <circle cx="300" cy="50" r="15" fill="#10b981" opacity="0.2"/>
    <path d="M 285 50 L 300 35 L 315 50 L 300 65 Z" fill="#10b981"/>
    <text x="300" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">ACH Transfer</text>
    <text x="300" y="115" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Bank Transfer</text>
  </g>
  
  <!-- Wire Transfer -->
  <g id="wire">
    <rect x="420" y="20" width="160" height="80" rx="8" fill="url(#wireGradient)" opacity="0.1" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 460 50 L 500 50 M 480 40 L 480 60 M 500 50 L 540 50" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="500" cy="50" r="8" fill="#8b5cf6"/>
    <text x="500" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">Wire Transfer</text>
    <text x="500" y="115" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Enterprise Only</text>
  </g>
</svg>
