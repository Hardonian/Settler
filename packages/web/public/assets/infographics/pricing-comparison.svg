<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" fill="none">
  <defs>
    <linearGradient id="freeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="commercialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="enterpriseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Start Free, Scale as You Grow</text>
  
  <!-- Free Plan -->
  <g id="free">
    <rect x="50" y="70" width="200" height="250" rx="12" fill="url(#freeGradient)" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af" text-anchor="middle">Free</text>
    <text x="150" y="125" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1e40af" text-anchor="middle">$0</text>
    <text x="150" y="145" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">forever</text>
    
    <rect x="70" y="170" width="160" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="150" y="190" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">1K transactions/mo</text>
    
    <rect x="70" y="210" width="160" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="150" y="230" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">2 platforms</text>
    
    <rect x="70" y="250" width="160" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="150" y="270" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Community support</text>
  </g>
  
  <!-- Commercial Plan -->
  <g id="commercial">
    <rect x="300" y="50" width="200" height="270" rx="12" fill="url(#commercialGradient)" opacity="0.15" stroke="#10b981" stroke-width="3"/>
    <text x="400" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">MOST POPULAR</text>
    <text x="400" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle">Commercial</text>
    <text x="400" y="135" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#059669" text-anchor="middle">$99</text>
    <text x="400" y="155" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">/month</text>
    
    <rect x="320" y="180" width="160" height="30" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="400" y="200" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">100K transactions/mo</text>
    
    <rect x="320" y="220" width="160" height="30" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="400" y="240" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Unlimited platforms</text>
    
    <rect x="320" y="260" width="160" height="30" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="400" y="280" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Priority support</text>
    
    <rect x="320" y="300" width="160" height="30" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="400" y="320" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">All features</text>
  </g>
  
  <!-- Enterprise Plan -->
  <g id="enterprise">
    <rect x="550" y="70" width="200" height="250" rx="12" fill="url(#enterpriseGradient)" opacity="0.1" stroke="#8b5cf6" stroke-width="2"/>
    <text x="650" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">Enterprise</text>
    <text x="650" y="125" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6d28d9" text-anchor="middle">Custom</text>
    
    <rect x="570" y="170" width="160" height="30" rx="4" fill="#8b5cf6" opacity="0.2"/>
    <text x="650" y="190" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Unlimited</text>
    
    <rect x="570" y="210" width="160" height="30" rx="4" fill="#8b5cf6" opacity="0.2"/>
    <text x="650" y="230" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Dedicated support</text>
    
    <rect x="570" y="250" width="160" height="30" rx="4" fill="#8b5cf6" opacity="0.2"/>
    <text x="650" y="270" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Custom SLA</text>
  </g>
</svg>
