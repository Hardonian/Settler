<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="sourceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="settlerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Source Platforms -->
  <g id="sources">
    <rect x="50" y="50" width="120" height="80" rx="8" fill="url(#sourceGradient)" filter="url(#shadow)"/>
    <text x="110" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Shopify</text>
    <text x="110" y="105" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Orders</text>
    
    <rect x="50" y="160" width="120" height="80" rx="8" fill="url(#sourceGradient)" filter="url(#shadow)"/>
    <text x="110" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Stripe</text>
    <text x="110" y="215" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Payments</text>
    
    <rect x="50" y="270" width="120" height="80" rx="8" fill="url(#sourceGradient)" filter="url(#shadow)"/>
    <text x="110" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">PayPal</text>
    <text x="110" y="325" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Payments</text>
  </g>
  
  <!-- Settler Engine -->
  <g id="settler">
    <circle cx="400" cy="200" r="80" fill="url(#settlerGradient)" filter="url(#shadow)"/>
    <text x="400" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Settler</text>
    <text x="400" y="210" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">API</text>
    <text x="400" y="225" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" opacity="0.8">99.7% Accuracy</text>
    
    <!-- Arrows from sources -->
    <path d="M 170 90 L 320 160" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 170 200 L 320 180" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 170 310 L 320 220" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  </g>
  
  <!-- Target Platform -->
  <g id="target">
    <rect x="630" y="150" width="120" height="100" rx="8" fill="url(#targetGradient)" filter="url(#shadow)"/>
    <text x="690" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">QuickBooks</text>
    <text x="690" y="205" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Reconciled</text>
    <text x="690" y="225" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Transactions</text>
    
    <!-- Arrow to target -->
    <path d="M 480 200 L 630 200" stroke="#10b981" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  
  <!-- Stats -->
  <g id="stats">
    <rect x="250" y="20" width="300" height="20" rx="4" fill="#f3f4f6"/>
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">Processing: 10M+ transactions/month</text>
  </g>
</svg>
