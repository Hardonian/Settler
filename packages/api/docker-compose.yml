version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=settler
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIGERBEETLE_ADDRESS=tigerbeetle:4300
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production
      - ENCRYPTION_KEY=dev-encryption-key-32-bytes-long!!
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - settler-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=settler
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - settler-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - settler-network

  tigerbeetle:
    image: tigerbeetle/tigerbeetle:latest
    ports:
      - "4300:4300"
    volumes:
      - tigerbeetle-data:/var/lib/tigerbeetle
    command: >
      start
      --addresses=0.0.0.0:4300
      /var/lib/tigerbeetle/data.tigerbeetle
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4300 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - settler-network
    depends_on:
      tigerbeetle-init:
        condition: service_completed_successfully

  tigerbeetle-init:
    image: tigerbeetle/tigerbeetle:latest
    volumes:
      - tigerbeetle-data:/var/lib/tigerbeetle
    command: >
      format
      --cluster=0
      --replica=0
      /var/lib/tigerbeetle/data.tigerbeetle
    networks:
      - settler-network

volumes:
  postgres-data:
  redis-data:
  tigerbeetle-data:

networks:
  settler-network:
    driver: bridge
