apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "settler.fullname" . }}-api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels: { app: {{ include "settler.fullname" . }}, component: api }
  template:
    metadata:
      labels: { app: {{ include "settler.fullname" . }}, component: api }
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api | quote }}
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: {{ include "settler.fullname" . }}-config }
            - secretRef: { name: {{ include "settler.fullname" . }}-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "settler.fullname" . }}-api
spec:
  type: {{ .Values.service.api.type }}
  selector: { app: {{ include "settler.fullname" . }}, component: api }
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: 4000
