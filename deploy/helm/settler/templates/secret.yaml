apiVersion: v1
kind: Secret
metadata:
  name: {{ include "settler.fullname" . }}-secrets
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required" .Values.secrets.DATABASE_URL | quote }}
  NEXTAUTH_SECRET: {{ required "secrets.NEXTAUTH_SECRET is required" .Values.secrets.NEXTAUTH_SECRET | quote }}
  SUPABASE_URL: {{ required "secrets.SUPABASE_URL is required" .Values.secrets.SUPABASE_URL | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ required "secrets.SUPABASE_SERVICE_ROLE_KEY is required" .Values.secrets.SUPABASE_SERVICE_ROLE_KEY | quote }}
  INVESTOR_API_KEY: {{ required "secrets.INVESTOR_API_KEY is required" .Values.secrets.INVESTOR_API_KEY | quote }}
  INVESTOR_BEARER_TOKEN: {{ required "secrets.INVESTOR_BEARER_TOKEN is required" .Values.secrets.INVESTOR_BEARER_TOKEN | quote }}
