# Redis Sentinel High-Availability Configuration (#87)
# Quorum: 2 sentinels required to agree on master failover

port 26379
dir "/tmp"

# Master monitoring definition
# sentinel monitor <master-name> <ip> <port> <quorum>
sentinel monitor settler-redis-master redis-master 6379 2

# Master considered down after 5000ms of non-response
sentinel down-after-milliseconds settler-redis-master 5000

# Failover timeout (milliseconds)
sentinel failover-timeout settler-redis-master 10000

# Maximum number of replicas configured to use new master in parallel
sentinel parallel-syncs settler-redis-master 1

# Security / Authentication
sentinel auth-pass settler-redis-master "${REDIS_PASSWORD:-settler_dev_redis_secret}"

# Prevent scripts from running as root
sentinel deny-scripts-reconfig yes
