[package]
name = "settler-kernel"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
serde_bytes = "0.11"
ryu = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = "50.0.0"

[dev-dependencies]
pretty_assertions = "1.4"

[[bench]]
name = "kernel_benchmark"
harness = false
