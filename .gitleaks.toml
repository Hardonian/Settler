# Gitleaks configuration for secret scanning
# https://github.com/gitleaks/gitleaks

title = "Settler Secret Scanning"

[extend]
# Use default rules
useDefault = true

[allowlist]
description = "Allowlist for false positives"
paths = [
  '''\.lock$''',
  '''node_modules/''',
  '''\.next/''',
  '''dist/''',
  '''build/''',
  '''\.env\.example''',
  '''\.env\.sample''',
  '''\.env\.template''',
  '''\.sample''',
  '''\.example''',
  '''\.template''',
  '''__tests__/''',
  '''\.test\.''',
  '''\.spec\.''',
  '''qa-artifacts/''',
  '''archive/''',
  '''marketing/''',
  '''docs/''',
  '''examples/''',
  '''\.settler/''',
  '''\.md$''',
  '''\.py$''',
  '''supabase/production-schema\.json''',
]

commits = [
  '''^Initial commit''',
  '''^Merge.*''',
  '''beaade49b1a5611f3c505452af372e878da4c974''',
  '''bd26db77ca4adee5fc650cb5c672eaacbc67db10''',
  '''e1e556471d2ee4facc895de8cab6b0da43caf5c7''',
  '''9f8f159a7465dd285cd5dd914cd1f12c1784fc15''',
  '''3b5f22a621fb762674e50f2d59ef9906350de0fa''',
]

regexes = [
  '''example.*key''',
  '''test.*secret''',
  '''sample.*token''',
  '''placeholder.*password''',
  '''stlr_live_9f823a9d8214''',
  '''stlr_test_[a-zA-Z0-9_]+''',
  '''X-API-Key:\s*stlr_test_[a-zA-Z0-9_]+''',
  '''rk_your_api_key''',
  '''rk_test_[a-zA-Z0-9_]+''',
  '''SETTLER_API_TOKEN''',
  '''Authorization:\s*Bearer\s*\$\{SETTLER_API_TOKEN\}''',
]

[[rules]]
id = "settler-api-key-example"
description = "Settler API key examples (allowlisted)"
regex = '''sk_test_[a-zA-Z0-9]{32,}'''
tags = ["key", "api"]
entropy = 3.5

[[rules]]
id = "settler-webhook-secret-example"
description = "Stripe webhook secret examples (allowlisted)"
regex = '''whsec_[a-zA-Z0-9]{32,}'''
tags = ["secret", "webhook"]
entropy = 3.5

